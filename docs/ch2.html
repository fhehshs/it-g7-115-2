<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資訊科技 7 年級第二學期 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

<script>window.__SLIDES__=[{"id": 1, "title": "電子元件五世代與 AI PC", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>💡<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>電子元件五世代與 AI PC<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Five Generations of Computers · CPU / GPU / NPU<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>💡 真空管<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>📻 電晶體<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔌 積體電路<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🤖 AI 晶片<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第二學期 ｜ 第 2 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "電腦的零件其實是「開關」", "chapter": "第一節：真空管與電晶體", "bg": "white", "html": "<h2 class='slide-title'>🔦 電腦最小的零件，其實是一個「開關」<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 上週學到電腦用 <strong>0 和 1<\/strong> 表示資料。要表示 0／1，就需要能快速切換「<strong>關／開<\/strong>」的電子開關。電腦的進步史，就是<strong>開關越做越小、越快、越省電<\/strong>的歷史。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><strong style='color:#991b1b;font-size:.9rem;'>💡 開關 = 1 個位元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>開＝1、關＝0。電腦裡有幾十億個開關同時在切換。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><strong style='color:#166534;font-size:.9rem;'>📏 開關變小有什麼好處？<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>同樣大小能塞更多開關 → 算得更快；路徑變短 → 更省電、更不容易發熱。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤔 你覺得一支手機裡大概有多少個開關？（答案在第二節揭曉）<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "第一代：真空管", "chapter": "第一節：真空管與電晶體", "bg": "white", "html": "<h2 class='slide-title'>💡 第一代（1940 年代）：真空管<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#fff7ed;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🏭<\/div><strong style='color:#9a3412;font-size:.9rem;'>ENIAC（1946 年公開）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>常被稱為最早的通用電子計算機之一：<br>🔹 約 <strong>18,000 支<\/strong>真空管<br>🔹 重約 <strong>30 公噸<\/strong><br>🔹 占滿一整個大房間<br>🔹 用電量驚人，真空管還常常燒壞要更換<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#1e40af;font-size:.9rem;'>真空管像什麼？<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>外觀像一顆燈泡，靠加熱發出電子來控制電流開關。<br>缺點：<strong>體積大、很燙、耗電、容易壞<\/strong>。<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 📌 當時改程式要重新接線（還記得馮紐曼要解決的問題嗎？）<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "第二代：電晶體", "chapter": "第一節：真空管與電晶體", "bg": "white", "html": "<h2 class='slide-title'>📻 第二代（1950 年代末起）：電晶體<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #2563eb;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 1947 年美國貝爾實驗室發明<strong>電晶體<\/strong>，它能做到和真空管一樣的開關功能，但<strong>小得多、不用加熱、耗電少、壽命長<\/strong>。<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>比較<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:39%;'>真空管<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:39%;'>電晶體<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>大小<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>像燈泡<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>像米粒（之後越做越小）<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>耗電與發熱<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>大、很燙<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>小得多<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>可靠度<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>常燒壞<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>耐用<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>生活應用<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>早期收音機、電視<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>電晶體收音機、早期商用電腦<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 💬 電晶體被認為是 20 世紀最重要的發明之一，今天所有晶片都是由電晶體組成。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "第一節 隨堂測驗", "chapter": "第一節：真空管與電晶體", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>真空管與電晶體 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 6, "title": "第三代：積體電路 IC", "chapter": "第二節：積體電路與個人電腦", "bg": "white", "html": "<h2 class='slide-title'>🔌 第三代（1960 年代中期起）：積體電路 IC<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #7c3aed;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 <strong>積體電路（Integrated Circuit, IC）<\/strong>：把許多電晶體和線路「做」在一小片矽晶片上。1958 年首次被做出來。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔍<\/div><strong style='color:#1e40af;font-size:.9rem;'>小<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>一片指甲大小的晶片，就能取代一整排電晶體電路<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>💰<\/div><strong style='color:#166534;font-size:.9rem;'>便宜<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>可以大量生產，電腦價格開始下降<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🏢<\/div><strong style='color:#854d0e;font-size:.9rem;'>普及<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>電腦走進大學、銀行、企業與政府機關<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧩 比喻：以前是一顆一顆積木自己拼；IC 就是工廠直接幫你把整組積木「印」好在一片板子上。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 7, "title": "第四代：超大型積體電路與個人電腦", "chapter": "第二節：積體電路與個人電腦", "bg": "white", "html": "<h2 class='slide-title'>💻 第四代（1970 年代起）：超大型積體電路 VLSI<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧠<\/div><strong style='color:#1e40af;font-size:.9rem;'>微處理器誕生<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>整顆 CPU 被做進<strong>一片晶片<\/strong>裡（1971 年出現第一顆商用微處理器）。一片晶片上的電晶體從幾千個增加到幾百萬、幾十億個。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🏠<\/div><strong style='color:#166534;font-size:.9rem;'>電腦走進家庭<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>1977 年 Apple II、1981 年 IBM PC 推出，「個人電腦（PC）」開始普及；1990 年代後，筆電、網路、手機一路發展。<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 📱 第一節的答案：今天高階手機的處理器晶片裡，有<strong>上百億個<\/strong>電晶體開關！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "摩爾定律", "chapter": "第二節：積體電路與個人電腦", "bg": "white", "html": "<h2 class='slide-title'>📈 摩爾定律：晶片上的電晶體大約每兩年翻倍<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 英特爾創辦人之一<strong>高登・摩爾<\/strong>觀察到：晶片上可容納的電晶體數量，大約<strong>每兩年增加一倍<\/strong>（1975 年修正後的說法）。這是一個「產業觀察」，不是物理定律。<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>經過幾年<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>0<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>2<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>4<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>6<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>8<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;'>10<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>電晶體數量（倍）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>4<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>8<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>16<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>32<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤔 <strong>算算看<\/strong>：照這個速度，20 年後會變成幾倍？（提示：2 乘 10 次）。近年電晶體已小到接近原子尺度，翻倍速度變慢，工程師改用「立體堆疊」「多晶片封裝」等方法繼續進步。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "五個世代總整理", "chapter": "第二節：積體電路與個人電腦", "bg": "white", "video": {"query": "電腦發展史 真空管 電晶體 積體電路", "title": "延伸影片：0 與 1 顛覆世界——電腦發展史", "desc": "在 YouTube 搜尋「電腦發展史 真空管 電晶體」"}, "html": "<h2 class='slide-title'>🗂️ 電腦五個世代總整理<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:14%;'>世代<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:18%;'>年代（約）<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:28%;'>主要元件<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>特色<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第一代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1940 年代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>真空管<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>巨大、耗電、常故障（ENIAC）<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第二代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1950 年代末<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>電晶體<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>變小、省電、可靠<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第三代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1960 年代中<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>積體電路 IC<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>更小更便宜，進入企業<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第四代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1970 年代起<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>超大型積體電路 VLSI<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>微處理器、個人電腦普及<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>第五代<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>現今<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>AI 晶片（GPU、NPU）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>語音辨識、影像辨識、生成式 AI<\/td><\/tr><\/table>\n<div id='video-section-9' class='video-section'><\/div>\n", "quiz": null, "chart": null}, {"id": 10, "title": "第二節 隨堂測驗", "chapter": "第二節：積體電路與個人電腦", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>積體電路、VLSI 與摩爾定律 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 11, "title": "第五代：人工智慧時代", "chapter": "第三節：AI 時代的處理器", "bg": "teal", "html": "\n<div style='text-align:center;padding:12px 10px 4px;'>\n  <div style='font-size:48px;margin-bottom:8px;'>🤖<\/div>\n  <h2 style='font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:6px;'>第五代：電腦開始「學習」<\/h2>\n  <p style='color:#ccfbf1;font-size:.95rem;margin-bottom:16px;'>不只照程式執行，還能從大量資料中找出規律<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>🗣️ 聽得懂<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>語音助理、即時字幕、語音輸入<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>👀 看得懂<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>人臉解鎖、拍照辨識植物、自駕車辨識路況<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>✍️ 會生成<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>生成式 AI 寫文字、畫圖、做音樂<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "CPU、GPU、NPU", "chapter": "第三節：AI 時代的處理器", "bg": "white", "html": "<h2 class='slide-title'>🍳 CPU、GPU、NPU：電腦裡的三種「廚師」<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧑‍🍳<\/div><strong style='color:#1e40af;font-size:.9rem;'>CPU 中央處理器<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>全能主廚<\/strong>：什麼菜都會做，擅長一步一步處理複雜的工作。負責電腦大部分的一般運算。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🎮<\/div><strong style='color:#166534;font-size:.9rem;'>GPU 圖形處理器<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>一大群廚助<\/strong>：每個人只會簡單動作，但幾千人<strong>同時<\/strong>切菜超快。擅長畫面、遊戲，也用來訓練 AI。<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🤖<\/div><strong style='color:#5b21b6;font-size:.9rem;'>NPU 神經網路處理器<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>AI 專用料理機<\/strong>：專門處理 AI 的運算，<strong>又快又省電<\/strong>。手機拍照美化、即時翻譯常靠它。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔑 不是誰取代誰，而是<strong>分工合作<\/strong>：一般工作給 CPU、畫面給 GPU、AI 推論給 NPU。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "AI PC 與 AI 手機", "chapter": "第三節：AI 時代的處理器", "bg": "white", "html": "<h2 class='slide-title'>💻 AI PC：內建 NPU 的電腦<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #7c3aed;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 2024 年起，各大廠推出「<strong>AI PC<\/strong>」：CPU、GPU、NPU 放在同一顆晶片上。例如微軟的 <strong>Copilot+ PC<\/strong> 規格要求 NPU 至少每秒 40 兆次運算（40 TOPS）。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💻<\/div><strong style='color:#1e40af;font-size:.9rem;'>在電腦上<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>即時字幕翻譯、視訊會議背景模糊、照片自動分類——不用把資料傳到雲端也能做。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📱<\/div><strong style='color:#166534;font-size:.9rem;'>在手機上<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>蘋果、高通、聯發科的手機晶片都內建 AI 運算單元，用來處理拍照、語音、文字摘要。<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🔒 <strong>為什麼要在「本機」跑 AI？<\/strong>速度快（不用等網路）、比較省電，而且照片和語音可以不必上傳，<strong>隱私比較有保障<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "TOPS 是什麼？", "chapter": "第三節：AI 時代的處理器", "bg": "white", "html": "<h2 class='slide-title'>🔢 看懂規格：GHz 和 TOPS<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:20%;'>規格<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:45%;'>意思<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:35%;'>怎麼看<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>GHz（吉赫）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>CPU 每秒可以跑多少「節拍」；3 GHz ≈ 每秒 30 億次<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>同一代 CPU 比，越高通常越快<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>核心數<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>CPU 裡有幾位「主廚」<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>多核心適合同時開很多程式<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>TOPS<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>NPU 每秒可做多少「兆次」運算（Tera Operations Per Second）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>越高，本機 AI 功能跑得越順<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ⚠️ 規格數字只能「同類比較」：不同品牌、不同世代的晶片，單看一個數字不一定準。選電腦還要看實際測試與用途（第 5 週會用試算表比較）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "第三節 隨堂測驗", "chapter": "第三節：AI 時代的處理器", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>CPU、GPU、NPU 與 AI PC ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 16, "title": "一顆晶片怎麼誕生", "chapter": "第四節：台灣與晶片", "bg": "white", "html": "<h2 class='slide-title'>🏭 一顆晶片怎麼誕生？台灣每個環節都有<\/h2>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#115e59;font-size:.88rem;'>IC 設計<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>工程師用軟體畫出晶片的電路藍圖。台灣代表：<strong>聯發科<\/strong>（手機晶片）<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#115e59;font-size:.88rem;'>晶圓製造<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>在矽晶圓上用光刻等上百道工序做出電晶體。台灣代表：<strong>台積電<\/strong><\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#115e59;font-size:.88rem;'>封裝測試<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>把晶片切開、包裝、測試是否正常。台灣代表：<strong>日月光<\/strong><\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🇹🇼 台積電的晶圓代工市占率超過全球一半（2024 年多家研究機構統計），許多知名品牌的 AI 晶片都由台灣製造。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "晶片的另一面", "chapter": "第四節：台灣與晶片", "bg": "white", "html": "<h2 class='slide-title'>⚖️ 晶片產業的另一面<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>👍<\/div><strong style='color:#166534;font-size:.9rem;'>帶來的好處<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 創造大量工作機會<br>🔹 讓台灣在國際上有影響力<br>🔹 推動 AI、醫療、交通等科技進步<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🤔<\/div><strong style='color:#991b1b;font-size:.9rem;'>需要面對的挑戰<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 晶圓廠<strong>用水、用電<\/strong>量大，乾旱時會和農業、民生搶水<br>🔹 電子廢棄物需要回收處理<br>🔹 人才培育與工作壓力<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 💬 <strong>討論<\/strong>：如果你是城市規劃者，要在家鄉蓋一座晶圓廠，你會先考慮哪 3 件事？<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "第四節 隨堂測驗", "chapter": "第四節：台灣與晶片", "bg": "purple", "quiz": "q4", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>晶片產業鏈 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 19, "title": "個人任務：處理器偵探", "chapter": "分組實作", "bg": "white", "html": "<h2 class='slide-title'>🕵️ 個人任務：我的裝置「處理器偵探」<\/h2>\n<div style='background:#eff6ff;border-radius:12px;padding:16px;margin-bottom:12px;'><p style='color:#1e40af;font-size:.9rem;font-weight:700;margin-bottom:8px;'>📋 選一台你常用的裝置（教室電腦、Chromebook 或家裡手機），填寫 Google 表單<\/p><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>① 找出處理器型號<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>Windows：設定 → 系統 → 系統資訊<br>Chromebook：網址列輸入 chrome://system<br>手機：設定 → 關於手機<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>② 查查它屬於第幾代<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>上網查這顆處理器的推出年份、核心數；有沒有 NPU？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>③ 寫一句話判斷<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>這台裝置適合做什麼？不適合做什麼？說出理由<\/div><\/div><\/div>\n<\/div><div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#f0fdf4;border-radius:10px;padding:14px;'><strong style='color:#166534;font-size:.9rem;'>⚠️ 注意事項<\/strong><ul style='color:#334155;font-size:.8rem;line-height:1.85;padding-left:18px;margin:6px 0 0;'><li>只抄<strong>處理器型號<\/strong>，不要截到序號、帳號或個人資料<\/li><li>查資料請寫下來源網址<\/li><li>家裡裝置請先問過家人再查看<\/li><\/ul><\/div><div style='background:#fffbeb;border-radius:10px;padding:14px;'><strong style='color:#92400e;font-size:.9rem;'>📏 評分（規準：資料處理）<\/strong><p style='font-size:.78rem;color:#334155;margin-top:6px;line-height:1.8;'><strong style='color:#059669;'>A<\/strong> 資料正確完整，判斷有根據且能比較多項規格<br><strong style='color:#2563eb;'>B<\/strong> 三項完成且資料正確<br><strong style='color:#d97706;'>C<\/strong> 引導下完成主要內容<br><strong style='color:#dc2626;'>D<\/strong> 僅完成部分內容<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 20, "title": "本章重點回顧", "chapter": "分組實作", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 2 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>五個世代<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>真空管 → 電晶體 → IC → VLSI → AI 晶片<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>越來越小<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>開關越小 → 塞越多 → 越快越省電；摩爾定律：約每兩年翻倍<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>三種處理器<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>CPU 全能主廚、GPU 一群廚助、NPU AI 專用料理機<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>台灣角色<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>設計（聯發科）、製造（台積電）、封測（日月光）；也要面對用水用電挑戰<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>CPU 再厲害，也需要「隊友」——電腦裡還有哪些重要單元？<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一週：電腦五大單元與記憶體<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "電腦的進步史，最主要是哪一種零件不斷改良？", "options": ["螢幕", "能快速切換開／關的電子開關", "鍵盤", "電源線"], "answer": 1, "explain": "電腦用 0／1 表示資料，靠的是電子開關。從真空管到電晶體再到晶片，都是讓開關越來越小、越快、越省電。"}, {"q": "ENIAC 屬於第幾代電腦？使用什麼元件？", "options": ["第一代，真空管", "第二代，電晶體", "第三代，積體電路", "第四代，微處理器"], "answer": 0, "explain": "ENIAC（1946 年公開）使用約 18,000 支真空管，重約 30 公噸，是第一代電腦的代表。"}, {"q": "電晶體取代真空管後，下列何者「不是」它帶來的改善？", "options": ["體積變小", "耗電變少", "比較不容易壞", "需要先加熱才能運作"], "answer": 3, "explain": "「需要加熱」正是真空管的缺點。電晶體不用加熱，所以更省電、更耐用、體積更小。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "「積體電路（IC）」的主要概念是？", "options": ["把許多電晶體和線路做在一小片晶片上", "把真空管排得更整齊", "用光纖取代電線", "把電腦接上網路"], "answer": 0, "explain": "IC 把大量電晶體與線路「整合」做在一片矽晶片上，所以叫「積體」電路。它讓電腦變得更小、更便宜。"}, {"q": "個人電腦（PC）開始普及，屬於哪一代電腦的特色？", "options": ["第一代", "第二代", "第三代", "第四代"], "answer": 3, "explain": "第四代使用超大型積體電路（VLSI），整顆 CPU 做進一片晶片，Apple II（1977）、IBM PC（1981）讓電腦走進家庭。"}, {"q": "依照摩爾定律（約每兩年翻倍），6 年後晶片上的電晶體數量約是現在的幾倍？", "options": ["3 倍", "6 倍", "8 倍", "12 倍"], "answer": 2, "explain": "6 年＝翻倍 3 次：1 → 2 → 4 → 8。翻倍是「乘以 2」，不是「加 2」，所以成長得非常快。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "哪一種處理器最像「幾千位廚助同時切菜」，擅長大量同時運算，常用在遊戲畫面與 AI 訓練？", "options": ["CPU", "GPU", "NPU", "ROM"], "answer": 1, "explain": "GPU 有非常多的小運算核心，可以「同時」處理大量簡單計算，所以適合畫面渲染和 AI 模型訓練。"}, {"q": "NPU 的主要用途是？", "options": ["儲存照片", "專門加速 AI 運算，又快又省電", "連接網路", "輸出聲音"], "answer": 1, "explain": "NPU（神經網路處理器）專門處理 AI 相關運算，例如拍照美化、即時翻譯，比用 CPU 算更快更省電。"}, {"q": "在手機「本機」執行 AI 功能，而不是把資料傳到雲端，下列何者是它的好處？", "options": ["照片和語音不必上傳，隱私較有保障", "手機一定會變便宜", "可以不用充電", "可以不需要處理器"], "answer": 0, "explain": "本機 AI 不必把資料傳到遠端伺服器，速度快、不怕網路不穩，個人資料也比較不會外流。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "晶片產業鏈中，「台積電」主要負責哪個環節？", "options": ["IC 設計", "晶圓製造", "封裝測試", "販售手機"], "answer": 1, "explain": "台積電是晶圓代工廠，負責把設計好的電路製造在晶圓上。聯發科負責設計，日月光負責封裝測試。"}, {"q": "晶片產業的正確流程順序是？", "options": ["封裝測試 → IC 設計 → 晶圓製造", "IC 設計 → 晶圓製造 → 封裝測試", "晶圓製造 → IC 設計 → 封裝測試", "IC 設計 → 封裝測試 → 晶圓製造"], "answer": 1, "explain": "先畫藍圖（設計），再照藍圖製造（晶圓製造），最後切割包裝並測試（封測）。"}, {"q": "下列何者是晶圓廠需要面對的環境挑戰？", "options": ["用水、用電量很大", "完全不需要用水", "只在夜間運作", "不會產生任何廢棄物"], "answer": 0, "explain": "晶圓製造需要大量超純水和電力，乾旱時可能和民生、農業用水競爭，也要妥善處理廢棄物。科技發展要同時考慮環境。"}]}};</script>

      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
</script>
