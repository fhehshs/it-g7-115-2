<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資訊科技 7 年級第二學期 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

us:10px;text-align:center;'><div style='font-size:1.8rem;'>➗<\/div><strong style='color:#166534;font-size:.9rem;'>③ 算術邏輯單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>ALU：負責<strong>計算<\/strong>與<strong>比較判斷<\/strong><\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>💾<\/div><strong style='color:#854d0e;font-size:.9rem;'>④ 記憶單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>存放<strong>程式<\/strong>與<strong>資料<\/strong><br>RAM、ROM、硬碟<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📤<\/div><strong style='color:#991b1b;font-size:.9rem;'>⑤ 輸出單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>呈現結果<br>🖥️ 螢幕 🖨️ 印表機<br>🔊 喇叭<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔑 <strong>控制單元 ＋ 算術邏輯單元 ＝ CPU（中央處理器）<\/strong>。還記得嗎？這五個部分就是巴貝奇當年的構想！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "用點餐來理解五大單元", "chapter": "第一節：電腦的五大單元", "bg": "white", "html": "<h2 class='slide-title'>🍔 用「早餐店點餐」理解五大單元<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>早餐店<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:43%;'>做的事<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:35%;'>對應電腦單元<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🧾 點餐單<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>客人寫下要吃什麼<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸入單元<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>👩‍💼 老闆娘<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>看單子、決定先做哪一份、叫誰做<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>控制單元<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>👨‍🍳 廚師<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>煎蛋、烤吐司、算總價<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>算術邏輯單元<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🧊 備料台＋冰箱<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>放食材和食譜，隨時取用<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>記憶單元<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🍽️ 出餐口<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>把做好的餐點交給客人<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸出單元<\/td><\/tr><\/table>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🧠 老闆娘＋廚師都在「廚房裡」決策和動手，就像控制單元＋ALU 都在 CPU 裡。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "一個動作，五個單元合作", "chapter": "第一節：電腦的五大單元", "bg": "white", "html": "<h2 class='slide-title'>🔄 在計算機 App 按下「3 + 5 =」發生了什麼？<\/h2>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>輸入單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>觸控螢幕偵測你按了 3、＋、5、＝<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>記憶單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>把 3 和 5 暫時存在記憶體（RAM）裡<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>控制單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>讀取程式指令：「把兩個數字相加」，通知 ALU 動工<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>算術邏輯單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>計算 3 + 5 = 8，把結果存回記憶體<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>5<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>輸出單元<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>螢幕顯示 8<\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ⚡ 這整個過程，電腦在<strong>不到千分之一秒<\/strong>內就完成了。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "動動腦：它屬於哪個單元？", "chapter": "第一節：電腦的五大單元", "bg": "white", "html": "<h2 class='slide-title'>🧩 動動腦：它屬於哪個單元？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🖨️<\/div><strong style='color:#334155;font-size:.9rem;'>掃描器<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📽️<\/div><strong style='color:#334155;font-size:.9rem;'>投影機<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>💾<\/div><strong style='color:#334155;font-size:.9rem;'>SSD 固態硬碟<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📷<\/div><strong style='color:#334155;font-size:.9rem;'>網路攝影機<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🎧<\/div><strong style='color:#334155;font-size:.9rem;'>耳機<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🏷️<\/div><strong style='color:#334155;font-size:.9rem;'>條碼掃描槍<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>⚡<\/div><strong style='color:#334155;font-size:.9rem;'>RAM 記憶體<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🖨️<\/div><strong style='color:#334155;font-size:.9rem;'>印表機<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>？<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🗣️ 先跟同學討論 1 分鐘，再看答案：輸入＝掃描器、網路攝影機、條碼掃描槍；輸出＝投影機、耳機、印表機；記憶＝SSD、RAM。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "第一節 隨堂測驗", "chapter": "第一節：電腦的五大單元", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>五大單元 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 7, "title": "主機板：電腦的城市地圖", "chapter": "第二節：主機板與 CPU", "bg": "white", "html": "<h2 class='slide-title'>🗺️ 主機板（Motherboard）：把所有零件連在一起<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 主機板是一大片電路板，所有零件都插在上面，靠上面的線路互相傳遞資料——就像一座城市的<strong>道路網<\/strong>。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧠<\/div><strong style='color:#1e40af;font-size:.9rem;'>CPU 插槽<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>放處理器的位置，上面通常蓋著散熱器和風扇<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⚡<\/div><strong style='color:#166534;font-size:.9rem;'>記憶體插槽<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>長條形插槽，插 RAM 記憶體條<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💾<\/div><strong style='color:#854d0e;font-size:.9rem;'>M.2／SATA 插槽<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>接 SSD 或傳統硬碟<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🎮<\/div><strong style='color:#5b21b6;font-size:.9rem;'>PCIe 插槽<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>插顯示卡等擴充卡<\/div><\/div><div style='background:#fff7ed;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔌<\/div><strong style='color:#9a3412;font-size:.9rem;'>電源接頭<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>電源供應器從這裡供電<\/div><\/div><div style='background:#f0fdfa;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔗<\/div><strong style='color:#115e59;font-size:.9rem;'>背板連接埠<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>USB、網路孔、HDMI、音源孔<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📱 手機也有主機板，只是零件都直接焊在一片小電路板上，所以無法自己更換。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "CPU 的核心與時脈", "chapter": "第二節：主機板與 CPU", "bg": "white", "html": "<h2 class='slide-title'>🧠 CPU：核心數與時脈<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>👨‍🍳<\/div><strong style='color:#1e40af;font-size:.9rem;'>核心數：有幾位廚師<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>多核心 CPU<\/strong> 是把多個處理核心做在同一顆晶片上。<br>1 位廚師一次做一道菜；8 位廚師可以同時做 8 道。<br>適合：邊開視訊、邊開簡報、邊播音樂。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⏱️<\/div><strong style='color:#166534;font-size:.9rem;'>時脈：廚師動作多快<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>單位 GHz。3 GHz ≈ 每秒 30 億個節拍。<br>同一世代的 CPU，時脈越高通常越快。<br>但不同世代不能只比 GHz，新世代每個節拍做得更多。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🍳 核心數＝<strong>幾個人<\/strong>做，時脈＝<strong>每個人多快<\/strong>。兩個都要看！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "為什麼 CPU 需要散熱？", "chapter": "第二節：主機板與 CPU", "bg": "white", "html": "<h2 class='slide-title'>🌡️ 為什麼 CPU 需要散熱？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔥<\/div><strong style='color:#991b1b;font-size:.9rem;'>電流產生熱<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>幾十億個電晶體一直開開關關，會產生大量熱<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🐢<\/div><strong style='color:#854d0e;font-size:.9rem;'>太熱會降速<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>CPU 太燙會自動降低速度保護自己，電腦就變卡<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>❄️<\/div><strong style='color:#1e40af;font-size:.9rem;'>散熱方法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>散熱片＋風扇、水冷；手機用導熱片和金屬框散熱<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 💡 <strong>使用好習慣<\/strong>：筆電不要放在棉被上用、不要擋住通風孔；手機邊充電邊玩大型遊戲容易過熱。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "第二節 隨堂測驗", "chapter": "第二節：主機板與 CPU", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>主機板與 CPU ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 11, "title": "RAM 隨機存取記憶體", "chapter": "第三節：記憶體的分類", "bg": "white", "html": "<h2 class='slide-title'>⚡ RAM 隨機存取記憶體：正在使用的資料放這裡<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⚡<\/div><strong style='color:#1e40af;font-size:.9rem;'>特性<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 <strong>斷電資料就消失<\/strong>（揮發性）<br>🔹 速度很快<br>🔹 存放「正在執行」的程式和資料<br>🔹 容量越大，可以同時開越多程式<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🪑<\/div><strong style='color:#854d0e;font-size:.9rem;'>比喻：書桌桌面<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>桌面越大，可以同時攤開越多課本和筆記，寫作業越順。<br>但放學（關機）時，桌面會被清空！<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📌 一般上網、文書：8–16 GB；剪輯影片、大型遊戲：16 GB 以上較順（依軟體需求而定）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "ROM 唯讀記憶體", "chapter": "第三節：記憶體的分類", "bg": "white", "html": "<h2 class='slide-title'>🔒 ROM 唯讀記憶體：開機的第一步<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔒<\/div><strong style='color:#5b21b6;font-size:.9rem;'>特性<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 <strong>斷電資料不消失<\/strong>（非揮發性）<br>🔹 出廠時就寫好內容，一般使用者不會修改<br>🔹 存放開機程式（<strong>BIOS／UEFI 韌體<\/strong>）<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📘<\/div><strong style='color:#166534;font-size:.9rem;'>比喻：家電說明書<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>永遠放在那裡，每次開機，電腦都先照著它「檢查硬體、找到作業系統」。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔄 開機順序：按電源 → 執行 ROM 裡的韌體 → 檢查硬體 → 從硬碟載入作業系統到 RAM → 出現桌面。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "輔助記憶體：HDD 與 SSD", "chapter": "第三節：記憶體的分類", "bg": "white", "html": "<h2 class='slide-title'>💾 輔助記憶體：長期保存資料<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:18%;'>比較<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:41%;'>傳統硬碟 HDD<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:41%;'>固態硬碟 SSD<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>原理<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>磁碟片旋轉、讀寫頭移動<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>快閃記憶體晶片，沒有會動的零件<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>速度<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>較慢（每秒約百 MB 等級）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>快很多（新式 NVMe 可達每秒數千 MB）<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>耐摔<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>怕震動<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>比較耐震<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>價格<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>同容量較便宜<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>較貴，但價格逐年下降<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>常見用途<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>大容量備份、監視器錄影<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>現在筆電、桌機的主流<\/td><\/tr><\/table>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🗄️ 比喻：硬碟是<strong>書架<\/strong>——放得很多、關機也不會不見，但要用時得先拿到桌上（RAM）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "記憶體階層", "chapter": "第三節：記憶體的分類", "bg": "white", "html": "<h2 class='slide-title'>🔺 記憶體階層：越快越貴越小，越慢越便宜越大<\/h2>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f5f3ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#5b21b6;font-size:.88rem;'>CPU 快取（Cache）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>在 CPU 裡面，最快、最小（MB 等級）<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f5f3ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#5b21b6;font-size:.88rem;'>RAM 主記憶體<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>很快，常見 8–32 GB，斷電消失<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f5f3ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#5b21b6;font-size:.88rem;'>SSD／HDD 輔助記憶體<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>較慢，常見 512 GB–數 TB，斷電保留<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f5f3ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#5b21b6;font-size:.88rem;'>雲端儲存<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>透過網路存取，空間大、隨處可用，但需要網路<\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🎒 生活比喻：手上拿的（快取）→ 桌面（RAM）→ 書架（硬碟）→ 學校圖書館（雲端）。越遠越慢，但能放越多。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "第三節 隨堂測驗", "chapter": "第三節：記憶體的分類", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>RAM、ROM、SSD ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 16, "title": "拆裝安全守則", "chapter": "第四節：打開主機看一看", "bg": "white", "html": "<h2 class='slide-title'>🦺 打開主機前：安全守則<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>✅<\/div><strong style='color:#991b1b;font-size:.9rem;'>一定要做<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 <strong>關機並拔掉電源線<\/strong>，等 1 分鐘再開<br>🔹 先摸金屬機殼<strong>釋放靜電<\/strong><br>🔹 螺絲放進盒子分類<br>🔹 每拆一步就<strong>拍照記錄<\/strong><\/div><\/div><div style='background:#fff7ed;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⛔<\/div><strong style='color:#9a3412;font-size:.9rem;'>絕對不要<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 用力拉扯排線<br>🔹 用手指摸晶片的金色接腳<br>🔹 拆電源供應器內部（有高壓電）<br>🔹 沒經過老師同意就動手<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> ⚡ 靜電看不見，但可能瞬間打壞記憶體或主機板。秋冬天氣乾燥時特別要注意！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "主機內部導覽", "chapter": "第四節：打開主機看一看", "bg": "white", "html": "<h2 class='slide-title'>🔍 主機內部導覽：找找看這些零件<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:26%;'>零件<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:44%;'>怎麼認<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:30%;'>屬於哪個單元<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>CPU（被散熱器蓋住）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>主機板中央、有風扇的金屬塊<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>控制＋算術邏輯<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>RAM<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>CPU 旁邊、長條形、可能有 2–4 條<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>記憶<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>SSD（M.2）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>口香糖大小的長方形小板子<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>記憶（輔助）<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>電源供應器<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>機殼角落的金屬盒，連到插座<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>供電（不屬五大單元）<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>顯示卡（若有）<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>插在長插槽、有風扇的大卡片<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>輸出（處理畫面）<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 📸 拆裝時用平板拍下每個零件，回到座位後在 Google 簡報標註名稱。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "第四節 隨堂測驗", "chapter": "第四節：打開主機看一看", "bg": "purple", "quiz": "q4", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>拆裝安全與零件辨識 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 19, "title": "分組實作：主機拆裝紀錄", "chapter": "分組實作", "bg": "white", "html": "<h2 class='slide-title'>🔧 分組實作：主機拆裝紀錄簡報<\/h2>\n<div style='background:#eff6ff;border-radius:12px;padding:16px;margin-bottom:12px;'><p style='color:#1e40af;font-size:.9rem;font-weight:700;margin-bottom:8px;'>📋 4 人一組：拆裝計畫 → 實際拆裝 → Google 簡報紀錄（至少 4 頁）<\/p><div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>分工<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>拆裝手、紀錄員、拍照員、檢查員（輪流）<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>第 1 頁：拆裝計畫<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>預計步驟與安全注意事項<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>第 2–3 頁：零件照片<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>至少標註 5 個零件名稱與所屬單元<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>第 4 頁：組回測試<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>開機成功了嗎？遇到什麼問題、怎麼解決<\/div><\/div><\/div>\n<\/div><div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#f0fdf4;border-radius:10px;padding:14px;'><strong style='color:#166534;font-size:.9rem;'>✅ 加分項目<\/strong><ul style='color:#334155;font-size:.8rem;line-height:1.85;padding-left:18px;margin:6px 0 0;'><li>用「早餐店」以外的比喻解釋五大單元<\/li><li>查出 RAM 和 SSD 的容量<\/li><li>寫下每個人的分工與心得<\/li><\/ul><\/div><div style='background:#fffbeb;border-radius:10px;padding:14px;'><strong style='color:#92400e;font-size:.9rem;'>📏 評分（規準：資料處理）<\/strong><p style='font-size:.78rem;color:#334155;margin-top:6px;line-height:1.8;'><strong style='color:#059669;'>A<\/strong> 步驟正確安全、標註完整，能說明各零件功能與關係<br><strong style='color:#2563eb;'>B<\/strong> 完成拆裝與紀錄，標註正確<br><strong style='color:#d97706;'>C<\/strong> 引導下完成拆裝與部分紀錄<br><strong style='color:#dc2626;'>D<\/strong> 僅完成部分步驟<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 20, "title": "本章重點回顧", "chapter": "分組實作", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 3 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>五大單元<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>輸入、控制、算術邏輯、記憶、輸出；控制＋ALU＝CPU<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>CPU<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;  "answer": 1, "explain": "CPU 運作會發熱，通風不良時溫度升高，CPU 會自動降速保護自己，甚至可能當機。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "正在寫報告時突然停電，還沒存檔的內容不見了。因為這些內容原本暫存在哪裡？", "options": ["ROM", "RAM", "SSD", "雲端硬碟"], "answer": 1, "explain": "RAM 是揮發性記憶體，斷電資料就消失。按下「儲存」才會寫進 SSD／硬碟（非揮發性）保存。"}, {"q": "電腦開機時最先執行的韌體（BIOS／UEFI）存放在哪裡？", "options": ["RAM", "ROM（或類似的非揮發性韌體晶片）", "螢幕", "滑鼠"], "answer": 1, "explain": "開機程式必須在斷電後仍然保存，所以放在 ROM 這類非揮發性記憶體。開機後再把作業系統從硬碟載入 RAM。"}, {"q": "關於 SSD 與 HDD 的比較，何者正確？", "options": ["HDD 沒有會動的零件", "SSD 讀寫速度通常比 HDD 快很多", "SSD 斷電資料會消失", "HDD 比 SSD 更耐摔"], "answer": 1, "explain": "SSD 使用快閃記憶體晶片，沒有旋轉零件，所以更快也更耐震。HDD 靠磁碟旋轉，怕摔。兩者斷電都會保留資料。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "打開電腦主機前，第一件要做的事是？", "options": ["直接拆下 CPU", "關機並拔掉電源線", "把螺絲全部丟在桌上", "用手摸記憶體金手指"], "answer": 1, "explain": "先關機並拔掉電源線才安全，再摸金屬機殼釋放靜電，之後才能開始拆裝。"}, {"q": "為什麼拆裝前要先摸金屬機殼？", "options": ["讓手變乾淨", "釋放身上的靜電，避免打壞零件", "測試機殼溫度", "讓電腦開機"], "answer": 1, "explain": "人身上的靜電可能瞬間打壞記憶體或主機板晶片。先接觸接地的金屬機殼，可以把靜電放掉。"}, {"q": "在主機板上，口香糖大小、長方形的小板子，最可能是什麼零件？", "options": ["M.2 SSD", "電源供應器", "散熱風扇", "螢幕"], "answer": 0, "explain": "M.2 SSD 體積小、長條狀，直接插在主機板的 M.2 插槽上。電源供應器是機殼角落的大金屬盒。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 20;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u96fb\u8166\u7684\u4e94\u5927\u55ae\u5143", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u4e3b\u6a5f\u677f\u8207 CPU", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u8a18\u61b6\u9ad4\u7684\u5206\u985e", "start": 11}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u6253\u958b\u4e3b\u6a5f\u770b\u4e00\u770b", "start": 16}, {"name": "\u5206\u7d44\u5be6\u4f5c", "start": 19}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}
