<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資訊科技 7 年級第二學期 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>

<script>window.__SLIDES__=[{"id": 1, "title": "程式語言與結構化程式設計", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>💬<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>程式語言與結構化程式設計<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Programming Languages · Structured Programming<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>0️⃣1️⃣ 機器語言<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🐍 高階語言<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🔁 循序／選擇／重複<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🐱 Scratch<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第二學期 ｜ 第 10–11 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "程式是什麼？", "chapter": "第一節：程式是什麼", "bg": "white", "html": "<h2 class='slide-title'>💻 程式（Program）是什麼？<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #0d9488;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 <strong>程式設計<\/strong>：依照邏輯順序，安排一組<strong>指令<\/strong>，讓電腦照著執行，實現演算法。<\/p><\/div>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>想清楚問題<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>要解決什麼？輸入是什麼？要得到什麼輸出？<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>設計演算法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>寫出步驟，或畫成流程圖（第 6–9 週學的）<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>寫成程式<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>用程式語言把步驟寫出來<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#eff6ff;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#1e40af;font-size:.88rem;'>測試與除錯<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>執行看看，結果不對就找出錯誤並修正<\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🐛 程式的錯誤叫做 <strong>bug（蟲）<\/strong>，找錯誤叫做 <strong>debug（除錯）<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "打孔卡與程式", "chapter": "第一節：程式是什麼", "bg": "white", "html": "<h2 class='slide-title'>🧵 程式的老祖先：提花織布機<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧵<\/div><strong style='color:#854d0e;font-size:.9rem;'>1804｜提花織布機<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>法國人<strong>雅卡爾<\/strong>發明用<strong>打孔卡片<\/strong>控制的織布機：卡片上的孔決定哪些線要提起，換一組卡片就織出不同花紋。<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#1e40af;font-size:.9rem;'>兩個重要概念<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>① 複雜的設計，可以轉換成機器看得懂的「編碼」<br>② 機器可以照著編碼<strong>不斷重複工作<\/strong>，直到完成<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🔗 串起來：提花織布機（1804）→ 何樂禮打孔卡（1890）→ 早期電腦程式也打在卡片上（第 1 週學過）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "電腦只懂 0 和 1", "chapter": "第一節：程式是什麼", "bg": "white", "html": "<h2 class='slide-title'>🗣️ 電腦只懂 0 和 1，人要怎麼跟它溝通？<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🧑<\/div><strong style='color:#1e40af;font-size:.9rem;'>人類<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>說中文、英文，會猜意思、能接受模糊<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔄<\/div><strong style='color:#854d0e;font-size:.9rem;'>翻譯官<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>把程式語言翻譯成機器語言<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🖥️<\/div><strong style='color:#166534;font-size:.9rem;'>電腦<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>只懂 0 與 1，而且完全照字面執行<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 程式語言就是人和電腦之間的「共同語言」。越接近人類語言越好寫，但需要翻譯；越接近 0 與 1，電腦越直接懂。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "第一節 隨堂測驗", "chapter": "第一節：程式是什麼", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>程式與程式設計 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 6, "title": "低階語言", "chapter": "第二節：程式語言的演進", "bg": "white", "html": "<h2 class='slide-title'>⚙️ 低階語言：機器語言與組合語言<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>0️⃣<\/div><strong style='color:#991b1b;font-size:.9rem;'>機器語言<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>由 <strong>0 與 1<\/strong> 組成，電腦可以直接執行。<br>例：<code>10110000 01100001<\/code><br>人很難看懂，不同 CPU 的機器語言也不同。<\/div><\/div><div style='background:#fff7ed;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔤<\/div><strong style='color:#9a3412;font-size:.9rem;'>組合語言<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>用簡短的英文代號代替 0 與 1，需要「組譯」成機器語言。<br>例：<code>MOV AL, 61h<\/code>（把數值放進暫存器）<br>和 CPU 的硬體結構密切相關。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 ⚡ 低階語言的優點：直接和 CPU 溝通、<strong>執行效率高<\/strong>；缺點：<strong>難寫、難懂、難移植<\/strong>到別種電腦。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 7, "title": "高階語言與翻譯", "chapter": "第二節：程式語言的演進", "bg": "white", "html": "<h2 class='slide-title'>🐍 高階語言：接近人類的語言<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #2563eb;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>📖 <strong>高階語言<\/strong>的語法接近英文和數學式，好學好讀；但要先<strong>翻譯<\/strong>成機器語言才能執行。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📚<\/div><strong style='color:#5b21b6;font-size:.9rem;'>編譯（Compile）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>像<strong>翻譯一整本書<\/strong>：全部翻好再拿去用。執行速度快。例：C 語言<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🎙️<\/div><strong style='color:#166534;font-size:.9rem;'>直譯（Interpret）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>像<strong>現場口譯<\/strong>：翻一句、執行一句。方便測試修改。例：Python、JavaScript<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🌏 同一份高階語言程式，換到不同電腦，只要有對應的翻譯程式就能執行，比低階語言方便多了。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "常見的程式語言", "chapter": "第二節：程式語言的演進", "bg": "white", "html": "<h2 class='slide-title'>📚 常見的程式語言<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:18%;'>語言<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:16%;'>推出年份<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:66%;'>特色與用途<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>FORTRAN<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1957<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>IBM 推出，最早的高階語言之一，用於科學與工程計算<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>COBOL<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1959<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>商業資料處理，銀行、會計系統至今仍有使用<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>C<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1972<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>強大的一般用途語言，常用來寫作業系統<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Python<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1991<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>語法簡潔、函式庫豐富，AI、資料分析很常用<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Java<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1995<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>跨平台，Android App、企業系統<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>JavaScript<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>1995<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>讓網頁「動起來」，現在也用在伺服器與遊戲<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Scratch<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>2007<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>MIT 開發的<strong>積木式<\/strong>語言，很適合入門<\/td><\/tr><\/table>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "同一件事，不同語言", "chapter": "第二節：程式語言的演進", "bg": "white", "html": "<h2 class='slide-title'>👋 同一件事，不同語言：讓電腦說「Hello」<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:24%;'>語言<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:76%;'>程式碼<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Python<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code>print(\"Hello\")<\/code><\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>JavaScript<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code>console.log(\"Hello\");<\/code><\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>C<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'><code>printf(\"Hello\");<\/code><\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>Scratch<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>拖出紫色積木「說出 Hello 持續 2 秒」<\/td><\/tr><\/table>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🧠 語法不一樣，但<strong>背後的邏輯是一樣的<\/strong>。學會一種語言的思考方式，再學其他語言就快多了。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "第二節 隨堂測驗", "chapter": "第二節：程式語言的演進", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>程式語言的演進 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 11, "title": "結構化程式設計", "chapter": "第三節：結構化程式設計", "bg": "teal", "html": "\n<div style='text-align:center;padding:12px 10px 4px;'>\n  <div style='font-size:48px;margin-bottom:8px;'>🧱<\/div>\n  <h2 style='font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:6px;'>結構化程式設計<\/h2>\n  <p style='color:#ccfbf1;font-size:.95rem;margin-bottom:16px;'>只用三種結構組合出所有程式，方便閱讀、檢查和修改<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>⬇️ 循序結構 Sequence<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>由上而下，一步接一步<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>🔀 選擇結構 Selection<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>依條件判斷，決定做哪一段<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>🔁 重複結構 Repetition<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>讓某些指令重複執行<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 12, "title": "循序結構", "chapter": "第三節：結構化程式設計", "bg": "white", "html": "<h2 class='slide-title'>⬇️ 循序結構：一步接一步<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.2fr;gap:12px;'><div style='display:flex;flex-direction:column;align-items:flex-start;gap:0;'><div style='display:flex;align-items:center;'><div style='width:210px;display:flex;justify-content:center;'><div style='border-radius:999px;background:#1e3a5f;color:#fff;width:150px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>開始<\/div><\/div><\/div><div style='width:210px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:210px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:150px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>擠牙膏<\/div><\/div><\/div><div style='width:210px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:210px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:150px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>刷牙 2 分鐘<\/div><\/div><\/div><div style='width:210px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:210px;display:flex;justify-content:center;'><div style='border-radius:4px;background:#dbeafe;color:#1e3a8a;width:150px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>漱口<\/div><\/div><\/div><div style='width:210px;text-align:center;color:#64748b;font-size:.95rem;line-height:1.3;'>↓<\/div><div style='display:flex;align-items:center;'><div style='width:210px;display:flex;justify-content:center;'><div style='border-radius:999px;background:#1e3a5f;color:#fff;width:150px;padding:9px 14px;text-align:center;font-size:.8rem;font-weight:600;line-height:1.4;'>結束<\/div><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⬇️<\/div><strong style='color:#1e40af;font-size:.9rem;'>特色<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 最基本的結構<br>🔹 指令<strong>由上而下<\/strong>依序執行<br>🔹 每個指令都會被執行，而且只執行一次<br><br>⚠️ 順序很重要：先漱口再擠牙膏，結果就不一樣了！<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "選擇結構", "chapter": "第三節：結構化程式設計", "bg": "white", "html": "<h2 class='slide-title'>🔀 選擇結構：依條件走不同的路<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>☂️<\/div><strong style='color:#854d0e;font-size:.9rem;'>單向選擇<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>如果<\/strong>下雨，<strong>就<\/strong>帶傘。<br>（沒下雨就什麼都不做，直接出門）<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📝<\/div><strong style='color:#5b21b6;font-size:.9rem;'>雙向選擇<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>如果<\/strong>分數 ≥ 60，顯示「及格」；<strong>否則<\/strong>顯示「不及格」。<br>（兩條路一定會走其中一條）<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔗 第 5 週試算表的 <strong>IF 函數<\/strong>就是雙向選擇！條件成立稱為 <strong>True（真）<\/strong>，不成立稱為 <strong>False（假）<\/strong>。<br>📌 選擇結構會在第三學期用 Scratch 深入練習。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "重複結構", "chapter": "第三節：結構化程式設計", "bg": "white", "html": "<h2 class='slide-title'>🔁 重複結構：讓電腦做重複的事<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🔢<\/div><strong style='color:#1e40af;font-size:.9rem;'>計次式迴圈<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>知道要重複幾次<\/strong>。<br>例：跳繩跳 100 下、繞操場跑 3 圈<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>⏰<\/div><strong style='color:#166534;font-size:.9rem;'>條件式迴圈<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>不知道幾次，但知道什麼時候停<\/strong>。<br>例：一直跑，跑到鐘聲響為止<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤖 電腦最擅長重複：重複 1 萬次也不會累、不會出錯。寫程式時，看到「一樣的事做很多次」就該想到迴圈。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "第三節 隨堂測驗", "chapter": "第三節：結構化程式設計", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>三種結構 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 16, "title": "Scratch 是什麼？", "chapter": "第四節：認識 Scratch", "bg": "white", "html": "<h2 class='slide-title'>🐱 Scratch：用積木寫程式<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fff7ed;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🧩<\/div><strong style='color:#9a3412;font-size:.9rem;'>積木式<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>不用打字，把積木<strong>拖曳、拼接<\/strong>起來就是程式，不會有拼字錯誤<\/div><\/div><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🌐<\/div><strong style='color:#1e40af;font-size:.9rem;'>免費、線上<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>MIT 媒體實驗室開發，用瀏覽器開啟 scratch.mit.edu 就能使用，也有離線版<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🎮<\/div><strong style='color:#166534;font-size:.9rem;'>做什麼都行<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>動畫、遊戲、互動故事、音樂……全世界有大量作品可以觀摩<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 積木的形狀會「卡」在一起：形狀不合的積木拼不上去，可以避免很多語法錯誤。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "Scratch 介面導覽", "chapter": "第四節：認識 Scratch", "bg": "white", "html": "<h2 class='slide-title'>🗺️ Scratch 介面導覽<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧱<\/div><strong style='color:#1e40af;font-size:.9rem;'>① 積木區（左）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>依顏色分類：動作（藍）、外觀（紫）、音效（粉紅）、事件（黃）、控制（橘黃）、偵測（淺藍）、運算（綠）、變數（橘）<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📝<\/div><strong style='color:#166534;font-size:.9rem;'>② 程式區（中）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>把積木拖到這裡組合成程式；右鍵可以「清理積木」排整齊<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🎭<\/div><strong style='color:#854d0e;font-size:.9rem;'>③ 舞台（右上）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>程式執行的地方；左上角的<strong>綠旗<\/strong>開始、<strong>紅色停止鈕<\/strong>結束<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🐱<\/div><strong style='color:#5b21b6;font-size:.9rem;'>④ 角色區（右下）<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>新增、選擇角色與背景；每個角色可以有自己的程式<\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "使用 Scratch 的好習慣", "chapter": "第四節：認識 Scratch", "bg": "white", "html": "<h2 class='slide-title'>🛡️ 使用 Scratch 的好習慣<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><strong style='color:#166534;font-size:.9rem;'>✅ 要這樣做<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 帳號名稱<strong>不要用真實姓名<\/strong><br>🔹 作品常常按「儲存」或下載到電腦<br>🔹 改編別人的作品，要在說明中<strong>註明原作者<\/strong>（Scratch 會自動標示改編來源）<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;'><strong style='color:#991b1b;font-size:.9rem;'>❌ 不要這樣做<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 在作品或留言中公開學校、電話、住址<br>🔹 直接複製別人作品當成自己的作業<br>🔹 留言攻擊或嘲笑別人的作品<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🔗 和上學期的<strong>個資保護<\/strong>與<strong>創用 CC<\/strong> 是一樣的道理：Scratch 社群分享的作品預設採用 CC BY-SA 授權。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 19, "title": "第四節 隨堂測驗", "chapter": "第四節：認識 Scratch", "bg": "purple", "quiz": "q4", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>認識 Scratch ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 20, "title": "個人實作：我的第一支 Scratch 程式", "chapter": "個人實作", "bg": "white", "html": "<h2 class='slide-title'>🐱 個人實作：我的第一支 Scratch 程式<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1.2fr;gap:12px;'><div style='background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:10px;'><div style='font-size:.75rem;color:#64748b;margin-bottom:8px;'>範例程式（可以自己改編）<\/div><div style='margin-left:0px;margin-bottom:4px;display:inline-block;width:auto;'><span style='display:inline-block;background:#ffbf00;color:#fff;border-radius:6px;padding:5px 12px;font-size:.8rem;font-weight:600;'>當綠旗被點擊<\/span><\/div><br><div style='margin-left:0px;margin-bottom:4px;display:inline-block;width:auto;'><span style='display:inline-block;background:#9966ff;color:#fff;border-radius:6px;padding:5px 12px;font-size:. 74151;font-size:.88rem;margin:0;line-height:1.7;'> 🎨 範例積木的顏色和 Scratch 一樣：黃＝事件、紫＝外觀、橘黃＝控制、藍＝動作。往右縮排的積木，代表放在「重複」裡面。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 21, "title": "本章重點回顧", "chapter": "個人實作", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 10–11 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>程式設計<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>依邏輯順序安排指令；流程：分析 → 演算法 → 寫程式 → 除錯<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>程式語言<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>機器語言（0/1）→ 組合語言 → 高階語言；高階語言需編譯或直譯<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>三種結構<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>循序（一步接一步）、選擇（依條件）、重複（計次式／條件式）<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>Scratch<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>MIT 積木式語言；積木區、程式區、舞台、角色區<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>程式要怎麼「記住」使用者輸入的數字？<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一週：Scratch 入門——變數與循序結構<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "程式中的錯誤叫做什麼？找出並修正錯誤叫做什麼？", "options": ["bug；debug", "app；update", "code；decode", "virus；antivirus"], "answer": 0, "explain": "程式錯誤叫 bug（蟲），修正錯誤叫 debug（除錯）。virus 是電腦病毒，是另一回事。"}, {"q": "1804 年發明、用打孔卡片控制花紋的機器是？", "options": ["巴斯卡加法器", "提花織布機", "何樂禮製表機", "ENIAC"], "answer": 1, "explain": "雅卡爾的提花織布機用打孔卡片控制花紋，換一組卡片就織出不同圖案，是「程式」概念的老祖先。"}, {"q": "為什麼需要程式語言？", "options": ["因為電腦只懂 0 與 1，人需要一種和電腦溝通的語言", "因為電腦會說中文", "為了讓電腦變漂亮", "為了讓網路變快"], "answer": 0, "explain": "電腦只懂 0 與 1，直接寫 0 與 1 太困難，所以發明程式語言作為人和電腦溝通的橋樑。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "下列哪一種語言由 0 與 1 組成，電腦可以直接執行？", "options": ["Python", "機器語言", "Scratch", "JavaScript"], "answer": 1, "explain": "機器語言是 0 與 1 組成的代碼，CPU 可以直接執行。其他都是高階語言，需要翻譯。"}, {"q": "「翻一句、執行一句」，像現場口譯的翻譯方式是？", "options": ["編譯", "直譯", "組譯", "列印"], "answer": 1, "explain": "直譯是一行一行翻譯並執行（例如 Python）；編譯是全部翻譯完再執行（例如 C）。"}, {"q": "MIT 開發、用拖曳積木方式寫程式、很適合入門的語言是？", "options": ["FORTRAN", "COBOL", "Scratch", "C"], "answer": 2, "explain": "Scratch 由 MIT 媒體實驗室開發（2007 年推出），用積木拼接寫程式，非常適合初學者。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "結構化程式設計的三種基本結構是？", "options": ["輸入、處理、輸出", "循序、選擇、重複", "開始、中間、結束", "加、減、乘"], "answer": 1, "explain": "循序（一步接一步）、選擇（依條件判斷）、重複（迴圈），三種結構可以組合出所有程式。"}, {"q": "「如果分數 ≥ 60 顯示及格，否則顯示不及格」屬於哪一種結構？", "options": ["循序結構", "單向選擇結構", "雙向選擇結構", "重複結構"], "answer": 2, "explain": "條件成立和不成立時各有要做的事，兩條路一定走其中一條，所以是雙向選擇。"}, {"q": "「一直練習投籃，直到連續投進 5 球為止」屬於哪一種迴圈？", "options": ["計次式迴圈", "條件式迴圈", "選擇結構", "循序結構"], "answer": 1, "explain": "事先不知道要投幾次，只知道停止條件（連進 5 球），所以是條件式迴圈。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "在 Scratch 中，要讓程式開始執行，通常要按什麼？", "options": ["紅色停止鈕", "綠旗", "角色圖示", "背景圖示"], "answer": 1, "explain": "按舞台左上方的綠旗開始執行（搭配「當綠旗被點擊」積木），紅色按鈕是停止。"}, {"q": "Scratch 積木區中，橘黃色的「控制」類積木包含下列哪一個？", "options": ["移動 10 點", "說出 Hello", "重複 10 次", "播放音效"], "answer": 2, "explain": "「重複 10 次」屬於控制類積木。移動是動作類，說出是外觀類，播放音效是音效類。"}, {"q": "使用 Scratch 線上社群時，下列哪個做法最正確？", "options": ["帳號用真實姓名和學號", "在留言公開自己的電話", "改編別人作品時註明原作者", "把別人的作品直接當作業交"], "answer": 2, "explain": "保護個資（不用真名、不公開電話），並尊重創作者（改編要註明原作者）。"}]}};</script>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 21;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u7a0b\u5f0f\u662f\u4ec0\u9ebc", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u7a0b\u5f0f\u8a9e\u8a00\u7684\u6f14\u9032", "start": 6}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u7d50\u69cb\u5316\u7a0b\u5f0f\u8a2d\u8a08", "start": 11}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u8a8d\u8b58 Scratch", "start": 16}, {"name": "\u500b\u4eba\u5be6\u4f5c", "start": 20}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
