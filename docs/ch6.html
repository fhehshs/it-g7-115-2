<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資訊科技 7 年級第二學期 — 互動教學</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════
   CSS 變數（全站顏色主題）
   ══════════════════════════════════════ */
:root {
  --navy:#1E3A5F; --teal:#0D9488; --sage:#6B8F8F;
  --purple:#6B3FA0; --gold:#F59E0B; --light:#F1F5F9; --white:#fff;
  --text:#111827; --muted:#374151;
  --radius:12px; --shadow:0 4px 20px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:#0f172a;color:var(--text);overflow:hidden;height:100vh}

/* ═══ 進度條 ═══ */
#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal),var(--gold));transition:width .4s;z-index:200}

/* ═══ 頂部導覽 ═══ */
#topbar{position:fixed;top:3px;left:0;right:0;height:48px;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#topbar .tb-title{color:#fff;font-size:.85rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .tb-counter{color:var(--gold);font-size:.8rem;white-space:nowrap}
#btn-toc{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
#btn-toc:hover{background:rgba(255,255,255,.1)}

/* ═══ 投影片容器 ═══ */
#slide-wrap{position:fixed;top:51px;left:280px;right:0;bottom:64px;overflow:hidden;transition:left .3s}
#slide-wrap.toc-hidden{left:0}
#slide-frame{width:100%;height:100%;padding:20px 24px;overflow-y:auto;transition:opacity .2s}

/* ═══ 投影片背景 ═══ */
.bg-navy{background:linear-gradient(135deg,#1E3A5F 0%,#0f2340 100%)}
.bg-teal{background:linear-gradient(135deg,#0D9488 0%,#065f46 100%)}
.bg-sage{background:linear-gradient(135deg,#6B8F8F 0%,#4a6b6b 100%)}
.bg-purple{background:linear-gradient(135deg,#6B3FA0 0%,#3b1f6b 100%)}
.bg-white{background:#f8fafc}

/* ═══ 底部導覽按鈕 ═══ */
#nav-bar{position:fixed;bottom:0;left:280px;right:0;height:64px;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;gap:16px;transition:left .3s;z-index:100}
#nav-bar.toc-hidden{left:0}
.nav-btn{background:var(--purple);color:#fff;border:none;padding:10px 28px;border-radius:24px;font-size:.9rem;cursor:pointer;font-weight:600;transition:all .2s}
.nav-btn:hover{background:#5a3290;transform:translateY(-1px)}
.nav-btn:disabled{background:#334155;cursor:not-allowed;transform:none}
#slide-dots{display:flex;gap:6px;align-items:center;max-width:300px;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:var(--gold);transform:scale(1.3)}
.dot.done{background:var(--teal)}

/* ═══ TOC 側邊欄 ═══ */
#toc{position:fixed;top:51px;left:0;width:280px;bottom:0;background:#0f172a;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;z-index:50;transition:transform .3s}
#toc.hidden{transform:translateX(-100%)}
#toc h3{padding:14px 16px 10px;color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
.toc-item{padding:7px 16px;font-size:.78rem;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.toc-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(245,158,11,.08)}
.toc-item.done{color:var(--teal)}
.toc-chapter{padding:8px 16px 4px;font-size:.7rem;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* ═══ 封面樣式 ═══ */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 130px);text-align:center;padding:20px}
.cover-badge{background:rgba(107,63,160,.3);color:#c4b5fd;padding:6px 18px;border-radius:20px;font-size:.8rem;letter-spacing:.08em;margin-bottom:20px;border:1px solid rgba(107,63,160,.4)}
.cover-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff;line-height:1.2;margin-bottom:12px}
.cover-sub{font-size:clamp(.9rem,1.5vw,1.1rem);color:#94a3b8;margin-bottom:24px;max-width:500px}
.cover-tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px}
.tag{background:rgba(255,255,255,.1);color:#cbd5e1;padding:5px 14px;border-radius:14px;font-size:.78rem;border:1px solid rgba(255,255,255,.15)}
.cover-meta{font-size:.75rem;color:#475569}

/* ═══ 投影片通用 ═══ */
.slide-inner{padding:8px 4px}
.slide-title{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:700;margin-bottom:12px;color:var(--text)}
.slide-desc{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.slide-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:8px}
.tip-box{background:linear-gradient(135deg,rgba(107,63,160,.1),rgba(30,58,95,.1));border:1px solid rgba(107,63,160,.25);border-radius:10px;padding:12px 16px;font-size:.83rem;color:var(--text);margin-top:12px;line-height:1.6}

/* ═══ 卡片格 ═══ */
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-card{background:rgba(255,255,255,.12);border-radius:10px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.15)}
.card-icon{font-size:1.6rem;margin-bottom:6px}
.card-label{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-desc{font-size:.72rem;color:rgba(255,255,255,.92);line-height:1.4}

/* ═══ 位元視覺 ═══ */
.bit-demo{background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.bit-box{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center}
.bit-off{background:rgba(239,68,68,.25);border:2px solid rgba(239,68,68,.5);color:#fca5a5}
.bit-on{background:rgba(34,197,94,.25);border:2px solid rgba(34,197,94,.5);color:#86efac}

/* ═══ 平台表格 ═══ */
.platform-table{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:10px}
.pt-header{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--navy);color:#fff;padding:8px 12px;font-size:.75rem;font-weight:600;gap:8px}
.pt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:8px 12px;font-size:.78rem;gap:8px;border-top:1px solid #f1f5f9;align-items:center}
.pt-row:nth-child(even){background:#f8fafc}
.pt-name{font-weight:600;color:var(--navy)}

/* ═══ 四層架構 ═══ */
.layer-stack{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.layer{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
.layer-hw{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.6);border-width:2px}
.layer-os{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.6);border-width:2px}
.layer-app{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.6);border-width:2px}
.layer-user{background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.6);border-width:2px}
.layer-num{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.18);color:#1e293b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.layer-name{font-weight:700;font-size:.88rem;color:#1e293b;margin-bottom:2px}
.layer-detail{font-size:.75rem;color:#475569}
.layer-arrow{text-align:center;color:#64748b;font-size:.9rem;margin:-4px 0}

/* ═══ 儲存單位 ═══ */
.units-grid{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.unit-row{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:8px;background:#f1f5f9;border:1px solid #e2e8f0}
.unit-small{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.08)}
.unit-large{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.unit-name{font-size:.82rem;font-weight:700;color:#1e293b;min-width:150px}
.unit-eq{font-size:.78rem;color:#475569}

/* ═══ 資料表格 ═══ */
.info-table{width:100%;border-collapse:collapse;font-size:.8rem;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
.info-table th,.info-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #f1f5f9}
.table-header{background:var(--navy);color:#fff}
.table-header th{color:#fff;font-weight:600;font-size:.78rem;padding:9px 12px}
.tr-highlight{background:rgba(13,148,136,.08)}
.info-table tr:last-child td{border-bottom:none}
.td-center{text-align:center}

/* ═══ 功能卡片 ═══ */
.func-card{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:10px;padding:10px 12px;border:1px solid #e2e8f0}
.fc-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.fc-title{font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:3px}
.fc-desc{font-size:.75rem;color:var(--muted);line-height:1.4}

/* ═══ Fact Box ═══ */
.fact-box{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
.fact-box p{font-size:.8rem;color:rgba(255,255,255,.95);margin-bottom:6px;line-height:1.5}

/* ═══ 圖表 ═══ */
.chart-wrap-full{width:100%;margin-bottom:10px}

/* ═══ 作業 ═══ */
.task-single{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.15);margin-bottom:14px}
.task-title{font-size:.82rem;font-weight:700;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.task-item{font-size:.78rem;color:rgba(255,255,255,.8);margin-bottom:7px;padding-left:4px;line-height:1.4}
.submit-box{display:flex;align-items:center;gap:14px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:12px;padding:14px 16px}
.submit-icon{font-size:2rem;flex-shrink:0}
.submit-title{font-size:.88rem;font-weight:700;color:#fff;margin-bottom:4px}
.submit-desc{font-size:.78rem;color:rgba(255,255,255,.8);line-height:1.5}

/* ═══ 影片區塊 ═══ */
.video-section{margin:10px 0}
.video-embed{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;max-width:560px;margin:0 auto}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-search-btn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:600;transition:all .2s;width:fit-content;margin:0 auto}
.video-search-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(220,38,38,.4)}
.video-search-btn .yt-icon{font-size:1.2rem}

/* ═══ 測驗 Modal ═══ */
#quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#quiz-overlay.show{display:flex}
#quiz-box{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#quiz-header{background:var(--purple);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center}
#quiz-header h3{font-size:.95rem;font-weight:700}
#quiz-header .qh-score{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:.78rem}
#quiz-body{padding:16px 20px;overflow-y:auto;flex:1}
.quiz-q{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.quiz-q:last-child{border-bottom:none}
.q-text{font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:10px;line-height:1.4}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;font-size:.82rem;transition:all .15s;line-height:1.3}
.q-opt:hover{border-color:var(--purple);background:#faf5ff}
.q-opt.selected{border-color:var(--navy);background:rgba(30,58,95,.05)}
.q-opt.correct{border-color:#10b981;background:#f0fdf4;color:#065f46}
.q-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.q-exp{font-size:.78rem;color:#374151;background:#f8fafc;padding:8px 12px;border-radius:8px;margin-top:8px;border-left:3px solid var(--purple);line-height:1.5}
#quiz-footer{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px}
#quiz-footer .qf-score{font-size:.88rem;font-weight:600;color:var(--navy)}
#btn-submit-quiz,#btn-close-quiz{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .15s}
#btn-submit-quiz{background:var(--navy);color:#fff}
#btn-submit-quiz:hover{background:#0f2340}
#btn-close-quiz{background:var(--purple);color:#fff;display:none}
#btn-close-quiz:hover{background:#5a3290}
</style>
</head>
<body>
<script>window.__SLIDES__=[{"id": 1, "title": "演算法是什麼？", "chapter": "封面", "bg": "navy", "html": "\n<div style='text-align:center;padding:24px 20px;'>\n  <div style='font-size:66px;margin-bottom:14px;'>🍳<\/div>\n  <h1 style='font-size:2.6rem;font-weight:900;color:#fff;margin-bottom:10px;'>演算法是什麼？<\/h1>\n  <h2 style='font-size:1.25rem;font-weight:400;color:#93c5fd;margin-bottom:24px;'>Algorithm · Step by Step Problem Solving<\/h2>\n  <div style='display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;'><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>📥 輸入→演算法→輸出<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>✅ 五大特性<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🧩 運算思維<\/span><span style='background:rgba(255,255,255,0.15);color:#e0f2fe;padding:8px 18px;border-radius:20px;'>🦫 Bebras<\/span><\/div>\n  <p style='color:#bfdbfe;font-size:1.05rem;'>七年級第二學期 ｜ 第 6–7 週<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 2, "title": "演算法與程式設計", "chapter": "第一節：什麼是演算法", "bg": "white", "html": "<h2 class='slide-title'>📖 演算法（Algorithm）與程式設計（Programming）<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📜<\/div><strong style='color:#1e40af;font-size:.9rem;'>演算法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>為了解決某個問題，所設計的一套<strong>有限、明確的步驟<\/strong>。<br>就像一份<strong>食譜<\/strong>：寫清楚先做什麼、再做什麼。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💻<\/div><strong style='color:#166534;font-size:.9rem;'>程式設計<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>把演算法用<strong>電腦看得懂的語言<\/strong>寫出來，讓電腦照著執行。<br>就像<strong>照著食譜實際下廚<\/strong>。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🔑 先想清楚步驟（演算法），再寫成程式（程式設計）。<strong>演算法是程式的靈魂<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 3, "title": "輸入＋演算法＝輸出", "chapter": "第一節：什麼是演算法", "bg": "white", "html": "<h2 class='slide-title'>🍳 用「煎荷包蛋」看演算法<\/h2>\n<div style='display:grid;grid-template-columns:1.4fr 1fr;gap:12px;'><table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:26%;'>輸入 Input<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:48%;'>演算法 Algorithm<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:26%;'>輸出 Output<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🫒 油<br>🥚 雞蛋<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>① 油倒進鍋中加熱<br>② 打蛋下鍋<br>③ 小火煎到蛋白凝固<br>④ 起鍋<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>🍳 荷包蛋<\/td><\/tr><\/table>\n<div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧮<\/div><strong style='color:#5b21b6;font-size:.9rem;'>簡單定義式<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><div style=\"font-size:1.05rem;font-weight:800;color:#5b21b6;text-align:center;margin:10px 0;\">輸入 ＋ 演算法 ＝ 輸出<\/div>同樣的輸入，換一套演算法（例如改成「炒」），就會得到不同的輸出（炒蛋）。<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤔 電腦的計算機 App 也一樣：輸入 3 和 5 → 演算法「相加」→ 輸出 8。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 4, "title": "生活中的演算法", "chapter": "第一節：什麼是演算法", "bg": "white", "html": "<h2 class='slide-title'>🌏 演算法就在你身邊<\/h2>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🗺️<\/div><strong style='color:#1e40af;font-size:.9rem;'>Google 地圖導航<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>輸入起點、終點 → 計算各條路線的時間 → 輸出最快的路線<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🚲<\/div><strong style='color:#166534;font-size:.9rem;'>YouBike 調度<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>分析各站借還車資料 → 決定哪些站要補車、哪些站要載走<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🚇<\/div><strong style='color:#854d0e;font-size:.9rem;'>捷運轉乘建議<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>台北捷運 Go 輸入兩站 → 找出轉乘次數最少或時間最短的路線<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📺<\/div><strong style='color:#5b21b6;font-size:.9rem;'>影音平台推薦<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>根據你看過的影片 → 計算你可能喜歡什麼 → 推薦給你<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 💬 推薦演算法很方便，但也可能讓你<strong>只看到同一類內容<\/strong>（同溫層）。上學期學的媒體識讀派上用場了！<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 5, "title": "一個問題，多種演算法", "chapter": "第一節：什麼是演算法", "bg": "white", "html": "<h2 class='slide-title'>🔀 同一個問題，可以有不同的演算法<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #2563eb;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>🎯 問題：從學校到台北車站<\/p><\/div>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:16%;'>演算法<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:40%;'>步驟<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>優點<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:22%;'>缺點<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>搭捷運<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>走到捷運站 → 搭車 → 轉乘 → 出站<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>準時、不塞車<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>要轉乘、要走路<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>搭公車<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>走到公車站 → 等車 → 坐到站<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>可能不用轉乘<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>尖峰時間會塞車<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>騎 YouBike<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>借車 → 騎到車站附近 → 還車<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>運動又環保<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>下雨不方便、比較累<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 好的演算法要看<strong>情況<\/strong>選擇：趕時間、下雨天、想運動，最適合的演算法都不一樣。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 6, "title": "第一節 隨堂測驗", "chapter": "第一節：什麼是演算法", "bg": "purple", "quiz": "q1", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第一節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>演算法的定義 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 7, "title": "演算法五大特性", "chapter": "第二節：演算法五大特性", "bg": "white", "html": "<h2 class='slide-title'>✅ 一個好的演算法，要符合五大特性<\/h2>\n<div style='display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📥<\/div><strong style='color:#1e40af;font-size:.9rem;'>輸入<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>有 0 個或 1 個以上的輸入值<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📤<\/div><strong style='color:#166534;font-size:.9rem;'>輸出<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>至少<\/strong>有 1 個輸出結果<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🎯<\/div><strong style='color:#854d0e;font-size:.9rem;'>明確性<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>每一步都清楚，不同人照做結果一樣<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>⏹️<\/div><strong style='color:#5b21b6;font-size:.9rem;'>有限性<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>在有限的步驟或時間內一定會結束<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>✔️<\/div><strong style='color:#991b1b;font-size:.9rem;'>有效性<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>每一步都做得到，用紙筆也能算出答案<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 記憶口訣：<strong>入、出、明、限、效<\/strong>。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 8, "title": "明確性", "chapter": "第二節：演算法五大特性", "bg": "white", "html": "<h2 class='slide-title'>🎯 明確性：「少許」到底是多少？<\/h2>\n<table style='width:100%;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;margin-bottom:12px;'><tr style='background:#1E3A5F;color:#fff;'><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>❌ 不明確<\/th><th style='padding:9px 12px;text-align:left;font-size:.8rem;width:50%;'>✅ 明確<\/th><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>加少許鹽<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>加 1 茶匙（約 5 公克）鹽<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>煮一下下<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>煮 3 分鐘<\/td><\/tr><tr style='background:#fff;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>走到前面右轉<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>直走 50 公尺，在便利商店路口右轉<\/td><\/tr><tr style='background:#f8fafc;'><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>把作業寫好<\/td><td style='padding:8px 12px;border-top:1px solid #e2e8f0;font-size:.8rem;color:#334155;vertical-align:top;line-height:1.6;'>完成講義第 3 頁第 1–5 題<\/td><\/tr><\/table>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🤖 電腦沒有「常識」，不會猜你的意思。給電腦的指令<strong>一定要明確<\/strong>，不然每次跑出來的結果可能都不一樣。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 9, "title": "有限性", "chapter": "第二節：演算法五大特性", "bg": "white", "html": "<h2 class='slide-title'>⏹️ 有限性：停不下來的洗髮步驟<\/h2>\n<div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🧴<\/div><strong style='color:#991b1b;font-size:.9rem;'>洗髮精背面的說明<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>① 搓揉起泡<br>② 沖洗乾淨<br>③ <strong>重複<\/strong><br><br>如果電腦照做，會<strong>永遠洗不完<\/strong>！因為沒有說要重複幾次、什麼時候停。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>✅<\/div><strong style='color:#166534;font-size:.9rem;'>改成有限的版本<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>① 搓揉起泡<br>② 沖洗乾淨<br>③ 重複 ①② <strong>共 2 次<\/strong>後結束<br><br>或：重複直到<strong>頭髮不油了<\/strong>就結束。<\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 🔁 這種停不下來的情況，在程式裡叫做<strong>無窮迴圈<\/strong>，是常見的程式錯誤（第 10 週會再遇到它）。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 10, "title": "輸入、輸出與有效性", "chapter": "第二節：演算法五大特性", "bg": "white", "html": "<h2 class='slide-title'>✔️ 輸入、輸出與有效性<\/h2>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📥<\/div><strong style='color:#1e40af;font-size:.9rem;'>輸入可以是 0 個<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>「印出 1 到 10」不需要使用者輸入任何東西，也是演算法<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📤<\/div><strong style='color:#166534;font-size:.9rem;'>輸出至少 1 個<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>演算法一定要產生結果，不然就沒有解決問題<\/div><\/div><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>✔️<\/div><strong style='color:#991b1b;font-size:.9rem;'>有效性：做得到嗎？<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>「把所有正整數加起來」做不到（數字無限多）；「把 1 到 100 加起來」就做得到<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧩 檢查題：「每天早上 7 點起床，然後飛到月球上課」符合哪個特性的問題？（答：有效性——飛到月球做不到）<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 11, "title": "第二節 隨堂測驗", "chapter": "第二節：演算法五大特性", "bg": "purple", "quiz": "q2", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第二節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>五大特性 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 12, "title": "運算思維四步驟", "chapter": "第三節：運算思維解決問題", "bg": "white", "html": "<h2 class='slide-title'>🧩 運算思維：像電腦科學家一樣解決問題<\/h2>\n<div style='display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔨<\/div><strong style='color:#1e40af;font-size:.9rem;'>① 拆解<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>把大問題<strong>拆成小問題<\/strong><\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🔍<\/div><strong style='color:#166534;font-size:.9rem;'>② 找規律<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>找出問題中<strong>重複出現<\/strong>的模式<\/div><\/div><div style='background:#fefce8;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>🎯<\/div><strong style='color:#854d0e;font-size:.9rem;'>③ 抽象化<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'><strong>留下重點<\/strong>，忽略不重要的細節<\/div><\/div><div style='background:#f5f3ff;padding:14px;border-radius:10px;text-align:center;'><div style='font-size:1.8rem;'>📜<\/div><strong style='color:#5b21b6;font-size:.9rem;'>④ 演算法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>寫出<strong>一步一步<\/strong>的解決方法<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🗺️ 捷運路線圖就是「抽象化」的好例子：只畫出站名和路線顏色，省略了真實的街道和距離。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 13, "title": "運算思維實例：規劃校外教學", "chapter": "第三節：運算思維解決問題", "bg": "white", "html": "<h2 class='slide-title'>🚌 用運算思維規劃一場校外教學<\/h2>\n<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:12px;'><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>1<\/div><div><strong style='color:#115e59;font-size:.88rem;'>拆解<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>交通、行程、午餐、預算、安全——拆成 5 個小問題<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>2<\/div><div><strong style='color:#115e59;font-size:.88rem;'>找規律<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>每個景點都要考慮「怎麼去、待多久、花多少錢」，可以用同一張表格整理<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>3<\/div><div><strong style='color:#115e59;font-size:.88rem;'>抽象化<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>只記錄重要資訊：地點、時間、費用；不需要知道景點的每一個細節<\/div><\/div><\/div><div style='display:flex;gap:12px;align-items:flex-start;background:#f0fdfa;border-radius:10px;padding:10px 14px;'><div style='width:28px;height:28px;border-radius:50%;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;'>4<\/div><div><strong style='color:#115e59;font-size:.88rem;'>演算法<\/strong><div style='font-size:.8rem;color:#475569;margin-top:3px;line-height:1.6;'>依時間排好順序：09:00 出發 → 10:00 參觀 → 12:00 午餐 → 15:30 回校<\/div><\/div><\/div><\/div>\n<div style='background:#fefce8;padding:11px 16px;border-radius:8px;border-left:4px solid #f59e0b;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'> 📊 還記得第 5 週的試算表嗎？「找規律」之後，用表格整理資料就是很好的做法。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 14, "title": "猜數字遊戲", "chapter": "第三節：運算思維解決問題", "bg": "white", "html": "<h2 class='slide-title'>🔢 猜數字遊戲：哪個演算法比較快？<\/h2>\n<div style='background:#f1f5f9;border-radius:10px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #7c3aed;'><p style='margin:0;color:#0f172a;font-size:.93rem;line-height:1.7;'>🎯 我心裡想一個 1～100 的整數，你猜，我只回答「太大」「太小」「答對」。<\/p><\/div>\n<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;'><div style='background:#fef2f2;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🐢<\/div><strong style='color:#991b1b;font-size:.9rem;'>演算法 A：從 1 開始猜<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>1？2？3？……運氣差要猜 <strong>100 次<\/strong><\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🚀<\/div><strong style='color:#166534;font-size:.9rem;'>演算法 B：每次猜中間<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>先猜 50 → 太大 → 猜 25 → 太小 → 猜 37……<br>每次刪掉一半，<strong>最多 7 次<\/strong>一定猜中！<\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 為什麼最多 7 次？100 → 50 → 25 → 13 → 7 → 4 → 2 → 1，每次減半，7 次就剩 1 個。這種方法叫<strong>二分搜尋<\/strong>，查字典時翻到中間再決定往前或往後，也是同樣的道理。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 15, "title": "第三節 隨堂測驗", "chapter": "第三節：運算思維解決問題", "bg": "purple", "quiz": "q3", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第三節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>運算思維 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 16, "title": "Bebras 運算思維挑戰", "chapter": "第四節：運算思維挑戰", "bg": "teal", "html": "\n<div style='text-align:center;padding:12px 10px 4px;'>\n  <div style='font-size:48px;margin-bottom:8px;'>🦫<\/div>\n  <h2 style='font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:6px;'>Bebras 國際運算思維挑戰賽<\/h2>\n  <p style='color:#ccfbf1;font-size:.95rem;margin-bottom:16px;'>2004 年起源於立陶宛，現在有幾十個國家參加；台灣每年也有舉辦<\/p>\n<\/div>\n<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>不用寫程式<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>題目是生活情境的小謎題，考的是思考方式<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>海狸當主角<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>Bebras 是立陶宛語的「海狸」<\/p><\/div><div style='background:rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;'><strong style='color:#fff;font-size:.9rem;'>練習四步驟<\/strong><p style='color:#ccfbf1;font-size:.8rem;margin-top:5px;line-height:1.7;'>拆解、找規律、抽象化、演算法通通用得到<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 17, "title": "挑戰 1：機器人送餐", "chapter": "第四節：運算思維挑戰", "bg": "white", "html": "<h2 class='slide-title'>🤖 挑戰 1：送餐機器人<\/h2>\n<div style='display:grid;grid-template-columns:1.3fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>🗺️<\/div><strong style='color:#1e40af;font-size:.9rem;'>題目<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>送餐機器人只聽得懂三個指令：<br>⬆️ <strong>前進 1 格<\/strong>　↪️ <strong>右轉<\/strong>　↩️ <strong>左轉<\/strong><br><br>機器人面向北方站在 A 點。餐桌在 A 點的<strong>北邊 2 格、再往東 1 格<\/strong>。<br>請寫出最短的指令序列。<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#166534;font-size:.9rem;'>想一想<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>🔹 先往哪個方向？<br>🔹 什麼時候轉彎？<br>🔹 你的指令有沒有符合「明確性」？<br><br><details><summary style=\"cursor:pointer;color:#166534;font-weight:700;\">看答案<\/summary>前進、前進、右轉、前進（共 4 個指令）<\/details><\/div><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 18, "title": "挑戰 2：海狸排隊", "chapter": "第四節：運算思維挑戰", "bg": "white", "html": "<h2 class='slide-title'>🦫 挑戰 2：海狸照身高排隊<\/h2>\n<div style='display:grid;grid-template-columns:1.3fr 1fr;gap:12px;'><div style='background:#eff6ff;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>📏<\/div><strong style='color:#1e40af;font-size:.9rem;'>題目<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>4 隻海狸排成一列，身高是：<br><strong style=\"font-size:1.1rem;\">3、1、4、2<\/strong><br><br>規則：每次只能讓<strong>相鄰的兩隻<\/strong>交換位置。<br>要排成 1、2、3、4（由矮到高），<strong>最少<\/strong>要交換幾次？<\/div><\/div><div style='background:#f0fdf4;padding:14px;border-radius:10px;'><div style='font-size:1.8rem;'>💡<\/div><strong style='color:#166534;font-size:.9rem;'>提示與答案<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>試著一步一步寫下每次交換後的隊伍。<br><br><details><summary style=\"cursor:pointer;color:#166534;font-weight:700;\">看答案<\/summary>3 次：3,1,4,2 → 1,3,4,2 → 1,3,2,4 → 1,2,3,4<\/details><\/div><\/div><\/div>\n<div style='background:#eff6ff;padding:11px 16px;border-radius:8px;border-left:4px solid #2563eb;'><p style='color:#374151;font-size:.88rem;margin:0;line-height:1.7;'>💬 🧠 這就是「排序」演算法的雛形！電腦排序成績、價格時，用的也是類似的比較與交換。<\/p><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 19, "title": "第四節 隨堂測驗", "chapter": "第四節：運算思維挑戰", "bg": "purple", "quiz": "q4", "html": "\n<div style='text-align:center;padding:44px 20px;'>\n  <div style='font-size:54px;margin-bottom:16px;'>📝<\/div>\n  <h1 style='font-size:2rem;color:#fff;margin-bottom:10px;'>第四節 隨堂測驗<\/h1>\n  <p style='color:#e9d5ff;font-size:1rem;'>運算思維挑戰 ｜ 3 題<\/p>\n  <p style='color:#c4b5fd;font-size:.85rem;margin-top:18px;'>按「下一頁 →」開始作答<\/p>\n<\/div>\n", "chart": null, "video": null}, {"id": 20, "title": "分組實作：生活演算法", "chapter": "分組實作", "bg": "white", "html": "<h2 class='slide-title'>🎯 分組實作：寫一份「別人照做一定成功」的生活演算法<\/h2>\n<div style='background:#eff6ff;border-radius:12px;padding:16px;margin-bottom:12px;'><p style='color:#1e40af;font-size:.9rem;font-weight:700;margin-bottom:8px;'>📋 在 Google 文件完成，3 人一組<\/p><div style='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;'><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>① 選一件日常任務<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>例如：泡一杯奶茶、從校門口走到電腦教室、用悠遊卡搭捷運<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>② 寫出步驟<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>標出輸入、輸出；步驟要<strong>編號<\/strong>，至少 6 步<\/div><\/div><div style='background:#f8fafc;padding:14px;border-radius:10px;'><strong style='color:#334155;font-size:.9rem;'>③ 交換測試<\/strong><div style='font-size:.8rem;color:#475569;margin-top:6px;line-height:1.7;'>請別組同學「一字不差」照做，記錄卡住或做錯的地方，再修改<\/div><\/div><\/div>\n<\/div><div style='display:grid;grid-template-columns:1.2fr 1fr;gap:12px;'><div style='background:#f0fdf4;border-radius:10px;padding:14px;'><strong style='color:#166534;font-size:.9rem;'>✅ 自我檢查<\/strong><ul style='color:#334155;font-size:.8rem;line-height:1.85;padding-left:18px;margin:6px 0 0;'><li>五大特性都符合嗎？逐條打勾<\/li><li>有沒有「少許、一下、差不多」這種模糊詞？<\/li><li>寫下修改前後的差異<\/li><\/ul><\/div><div style='background:#fffbeb;border-radius:10px;padding:14px;'><strong style='color:#92400e;font-size:.9rem;'>📏 評分（規準：演算法）<\/strong><p style='font-size:.78rem;color:#334155;margin-top:6px;line-height:1.8;'><strong style='color:#059669;'>A<\/strong> 步驟完整明確、符合五大特性，並能依測試結果修正<br><strong style='color:#2563eb;'>B<\/strong> 步驟完整且大致明確<br><strong style='color:#d97706;'>C<\/strong> 引導下完成步驟<br><strong style='color:#dc2626;'>D<\/strong> 僅完成部分步驟<\/p><\/div><\/div>\n", "quiz": null, "chart": null, "video": null}, {"id": 21, "title": "本章重點回顧", "chapter": "分組實作", "bg": "navy", "html": "\n<h2 style='color:#fff;font-size:1.5rem;font-weight:700;margin-bottom:14px;'>📌 第 6–7 週 重點回顧<\/h2>\n<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;'><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>演算法<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>解決問題的有限、明確步驟；輸入＋演算法＝輸出<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>五大特性<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>輸入（0 個以上）、輸出（至少 1 個）、明確性、有限性、有效性<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>運算思維<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>拆解、找規律、抽象化、演算法<\/p><\/div><div style='background:rgba(255,255,255,.1);border-radius:10px;padding:13px;'><strong style='color:#93c5fd;font-size:.9rem;'>好演算法<\/strong><p style='color:#e2e8f0;font-size:.8rem;margin-top:5px;line-height:1.7;'>同一問題有多種解法；二分搜尋每次刪一半，比一個一個猜快<\/p><\/div><\/div>\n<div style='background:linear-gradient(90deg,rgba(13,148,136,.35),rgba(107,63,160,.35));border-radius:10px;padding:16px 20px;text-align:center;'>\n  <p style='color:#fff;font-size:1.02rem;font-weight:700;margin:0;'>寫成文字的步驟很長很難看——有沒有更清楚的表示方法？<\/p>\n  <p style='color:#cbd5e1;font-size:.82rem;margin-top:6px;'>下一週：流程圖符號與繪製<\/p>\n<\/div>\n", "quiz": null, "chart": null, "video": null}];window.__QUIZZES__={"q1": {"title": "第一節 隨堂測驗", "questions": [{"q": "關於「演算法」，下列敘述何者最正確？", "options": ["一種電腦硬體", "為了解決問題所設計的一套有限、明確的步驟", "只有數學家才用得到", "一定要用電腦才能執行"], "answer": 1, "explain": "演算法是解決問題的步驟。食譜、導航、組裝說明書都是演算法，不一定要用電腦執行。"}, {"q": "「演算法」和「程式設計」的關係，最像下列哪一組？", "options": ["食譜 和 照著食譜下廚", "鍋子 和 爐子", "筷子 和 湯匙", "冰箱 和 微波爐"], "answer": 0, "explain": "演算法像食譜（寫好步驟），程式設計像照著食譜下廚（用程式語言讓電腦真的去做）。"}, {"q": "煎荷包蛋的例子中，「雞蛋」屬於哪一部分？", "options": ["輸入", "演算法", "輸出", "都不是"], "answer": 0, "explain": "雞蛋和油是放進去的材料＝輸入；煎蛋的步驟＝演算法；荷包蛋＝輸出。"}]}, "q2": {"title": "第二節 隨堂測驗", "questions": [{"q": "食譜寫「加少許鹽」，違反了演算法的哪個特性？", "options": ["輸入", "有限性", "明確性", "有效性"], "answer": 2, "explain": "「少許」每個人理解不同，照做的結果不一樣，所以違反明確性。改成「加 1 茶匙鹽」就明確了。"}, {"q": "洗髮說明寫「搓揉、沖洗、重複」，如果電腦照做會發生什麼事？", "options": ["洗兩次就停", "永遠停不下來，違反有限性", "完全不會執行", "會自動洗得很乾淨"], "answer": 1, "explain": "沒有說重複幾次或何時停止，電腦就會一直重複下去，違反有限性。這在程式中叫無窮迴圈。"}, {"q": "關於演算法的輸入與輸出，下列何者正確？", "options": ["一定要有輸入，可以沒有輸出", "可以沒有輸入，但至少要有 1 個輸出", "輸入和輸出都可以沒有", "輸入和輸出都只能有 1 個"], "answer": 1, "explain": "輸入可以是 0 個以上（例如「印出 1 到 10」不需輸入）；輸出至少要有 1 個，不然沒有解決問題。"}]}, "q3": {"title": "第三節 隨堂測驗", "questions": [{"q": "捷運路線圖只畫出站名和路線顏色，省略真實街道與距離，這是運算思維的哪個步驟？", "options": ["拆解", "找規律", "抽象化", "演算法"], "answer": 2, "explain": "抽象化是「留下重點、忽略不重要的細節」。搭捷運只需要知道站名和怎麼轉乘，不需要真實的街道。"}, {"q": "把「規劃校外教學」分成交通、行程、午餐、預算、安全五個小問題，屬於哪個步驟？", "options": ["拆解", "找規律", "抽象化", "輸出"], "answer": 0, "explain": "把大問題拆成幾個比較容易處理的小問題，就是拆解。"}, {"q": "猜 1～100 的數字，每次都猜「剩下範圍的中間」，最多需要猜幾次就一定能猜中？", "options": ["5 次", "7 次", "10 次", "50 次"], "answer": 1, "explain": "每次刪掉一半：100 → 50 → 25 → 13 → 7 → 4 → 2 → 1，最多 7 次。這就是二分搜尋。"}]}, "q4": {"title": "第四節 隨堂測驗", "questions": [{"q": "送餐機器人面向北方，執行「前進、右轉、前進」後，它在起點的哪個方向？", "options": ["北邊 1 格、東邊 1 格", "北邊 2 格", "東邊 2 格", "北邊 1 格、西邊 1 格"], "answer": 0, "explain": "面向北前進 1 格（北 1）→ 右轉後面向東 → 前進 1 格（東 1）。所以在起點的北邊 1 格、東邊 1 格。"}, {"q": "海狸身高 2、1、3，每次只能交換相鄰兩隻，最少交換幾次可以排成 1、2、3？", "options": ["0 次", "1 次", "2 次", "3 次"], "answer": 1, "explain": "只要交換前兩隻（2 和 1），就變成 1、2、3，所以 1 次就夠了。"}, {"q": "Bebras 運算思維挑戰賽的題目，主要在考什麼？", "options": ["打字速度", "背誦程式語法", "用運算思維解決生活情境的謎題", "電腦零件的價格"], "answer": 2, "explain": "Bebras 的題目不需要寫程式，而是透過生活情境的小謎題，練習拆解、找規律、抽象化和設計演算法。"}]}};</script>

        <button id="btn-submit-quiz" onclick="submitQuiz()">送出答案</button>
        <button id="btn-close-quiz" onclick="closeQuiz()">繼續學習 →</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  從 Jinja2 模板取得 Flask 傳入的資料
// ════════════════════════════════════════════════════════════
const TOTAL_SLIDES = 21;
const CHAPTERS_DATA = [{"name": "\u5c01\u9762", "start": 1}, {"name": "\u7b2c\u4e00\u7bc0\uff1a\u4ec0\u9ebc\u662f\u6f14\u7b97\u6cd5", "start": 2}, {"name": "\u7b2c\u4e8c\u7bc0\uff1a\u6f14\u7b97\u6cd5\u4e94\u5927\u7279\u6027", "start": 7}, {"name": "\u7b2c\u4e09\u7bc0\uff1a\u904b\u7b97\u601d\u7dad\u89e3\u6c7a\u554f\u984c", "start": 12}, {"name": "\u7b2c\u56db\u7bc0\uff1a\u904b\u7b97\u601d\u7dad\u6311\u6230", "start": 16}, {"name": "\u5206\u7d44\u5be6\u4f5c", "start": 20}];

// ════════════════════════════════════════════════════════════
//  全域狀態
// ════════════════════════════════════════════════════════════
let slides = [];
let quizzes = {};
let cur = 0;
let answered = {};
let tocVisible = true;
const chartInstances = {};

// ════════════════════════════════════════════════════════════
//  初始化：從 Flask API 取得資料
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const [slidesRes, quizzesRes] = await Promise.all([
      Promise.resolve({json:()=>window.__SLIDES__}),
      Promise.resolve({json:()=>window.__QUIZZES__})
    ]);
    slides = await slidesRes.json();
    quizzes = await quizzesRes.json();
    buildToc();
    buildDots();
    goTo(0);
  } catch (e) {
    console.error('資料載入失敗：', e);
    document.getElementById('slide-frame').innerHTML =
      "<div style='color:red;padding:20px'>❌ 請確認 Flask 伺服器已啟動！<br><code>python app.py</code></div>";
  }
}

// ════════════════════════════════════════════════════════════
//  建立目錄（TOC）
// ════════════════════════════════════════════════════════════
function buildToc() {
  const list = document.getElementById('toc-list');
  let lastChapter = '';
  slides.forEach((s, i) => {
    if (s.chapter !== lastChapter) {
      const ch = document.createElement('div');
      ch.className = 'toc-chapter';
      ch.textContent = s.chapter;
      list.appendChild(ch);
      lastChapter = s.chapter;
    }
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.id = `toc-${i}`;
    item.textContent = `${s.id}. ${s.title}`;
    item.onclick = () => goTo(i);
    list.appendChild(item);
  });
}

// ════════════════════════════════════════════════════════════
//  建立點狀導覽
// ════════════════════════════════════════════════════════════
function buildDots() {
  const wrap = document.getElementById('slide-dots');
  const step = Math.max(1, Math.floor(slides.length / 15));
  slides.forEach((s, i) => {
    if (i % step !== 0 && i !== slides.length - 1) return;
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    d.title = s.title;
    d.onclick = () => goTo(i);
    wrap.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════
//  前往特定投影片
// ════════════════════════════════════════════════════════════
function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  cur = idx;
  const s = slides[cur];
  const frame = document.getElementById('slide-frame');
  frame.className = '';
  frame.classList.add('bg-' + s.bg);
  frame.style.opacity = '0';
  frame.innerHTML = s.html;
  setTimeout(() => { frame.style.opacity = '1'; }, 30);
  frame.scrollTop = 0;
  if (s.chart) setTimeout(() => renderChart(s.chart), 80);
  if (s.video) setTimeout(() => renderVideo(s.id, s.video), 80);
  updateNav();
  updateToc();
  updateProgress();
}

// ════════════════════════════════════════════════════════════
//  導覽：下一頁（有測驗時先觸發測驗）
// ════════════════════════════════════════════════════════════
function nextSlide() {
  const s = slides[cur];
  if (s.quiz && !answered[s.quiz]) {
    showQuiz(s.quiz);
  } else {
    goTo(cur + 1);
  }
}
function prevSlide() { goTo(cur - 1); }

// ════════════════════════════════════════════════════════════
//  更新導覽列、進度條、TOC
// ════════════════════════════════════════════════════════════
function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  const isLast = cur === slides.length - 1;
  const hasUnansweredQuiz = slides[cur].quiz && !answered[slides[cur].quiz];
  document.getElementById('btn-next').disabled = isLast && !hasUnansweredQuiz;
  document.getElementById('tb-chapter').textContent = slides[cur].chapter + '：' + slides[cur].title;
  document.getElementById('tb-counter').textContent = `${cur + 1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach(d => {
    d.classList.remove('active');
    const i = parseInt(d.id.replace('dot-', ''));
    if (cur === i) d.classList.add('active');
    else if (cur > i) d.classList.add('done');
    else d.classList.remove('done');
  });
}

function updateProgress() {
  const pct = ((cur + 1) / slides.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function updateToc() {
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === cur) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
    else if (i < cur) el.classList.add('done');
  });
}

// ════════════════════════════════════════════════════════════
//  切換 TOC 顯示
// ════════════════════════════════════════════════════════════
function toggleToc() {
  tocVisible = !tocVisible;
  document.getElementById('toc').classList.toggle('hidden', !tocVisible);
  document.getElementById('slide-wrap').classList.toggle('toc-hidden', !tocVisible);
  document.getElementById('nav-bar').classList.toggle('toc-hidden', !tocVisible);
}

// ════════════════════════════════════════════════════════════
//  鍵盤快捷鍵
// ════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ════════════════════════════════════════════════════════════
//  影片渲染（YouTube 嵌入 / 搜尋按鈕 / 兩者兼具）
//  嵌入使用 youtube-nocookie.com（不追蹤、不推薦其他影片、無個人化廣告）
//  參數 rel=0（結束不推薦別家頻道）、modestbranding=1（隱藏 YT logo）
// ════════════════════════════════════════════════════════════
function _ytEmbedHtml(vid, title) {
  // 使用 youtube-nocookie.com — YouTube 官方「隱私強化」網域，更乾淨
  return `
    <div class="video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&fs=1"
        allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        loading="lazy"></iframe>
    </div>
    <p style="text-align:center;font-size:.72rem;color:rgba(255,255,255,.55);margin-top:6px">▶ ${title}</p>`;
}
function _ytSearchHtml(query, title, desc) {
  const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
  return `
    <a href="${url}" target="_blank" class="video-search-btn">
      <span class="yt-icon">▶️</span>
      <span>
        <strong>${title}</strong><br>
        <small style="font-weight:400;opacity:.8">${desc}</small>
      </span>
    </a>`;
}

function renderVideo(slideId, video) {
  const el = document.getElementById(`video-section-${slideId}`);
  if (!el) return;
  if (video.type === 'youtube') {
    el.innerHTML = _ytEmbedHtml(video.id, video.title);
  } else if (video.type === 'both') {
    // 嵌入播放器 + 底下附「找不到？搜尋更多」備援
    el.innerHTML = `
      ${_ytEmbedHtml(video.id, video.title)}
      <div style="margin-top:10px;">
        ${_ytSearchHtml(video.query, video.search_title || '想看更多相關影片', video.desc || '在 YouTube 搜尋同主題其他教學')}
      </div>`;
  } else {
    el.innerHTML = _ytSearchHtml(video.query, video.title, video.desc);
  }
}

// ════════════════════════════════════════════════════════════
//  圖表渲染（Chart.js，防止重複建立）
// ════════════════════════════════════════════════════════════
function renderChart(type) {
  if (type === 'formats') {
    const el = document.getElementById('chart-formats');
    if (!el || chartInstances['formats']) return;
    chartInstances['formats'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['JPEG（照片）', 'PNG（圖示）', 'PNG（截圖）', 'SVG（Logo）'],
        datasets: [{
          label: '典型檔案大小（KB）',
          data: [150, 400, 1200, 8],
          backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#a855f7'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.raw} KB` } }
        },
        scales: {
          y: {
            type: 'logarithmic',
            title: { display: true, text: '檔案大小 KB（對數刻度）', color:'#6b7280', font:{size:10} },
            ticks: { color:'#6b7280', font:{size:10}, callback: v => v + ' KB' }
          },
          x: { ticks: { color:'#374151', font:{size:11} }, grid:{display:false} }
        }
      }
    });
  }

  if (type === 'ai_tools') {
    const el = document.getElementById('chart-ai-tools');
    if (!el || chartInstances['ai_tools']) return;
    chartInstances['ai_tools'] = new Chart(el, {
      type: 'bar',
      data: {
        labels: ['ChatGPT GPT-4o', 'Canva AI', 'Midjourney', 'Adobe Firefly'],
        datasets: [
          {
            label: '圖像品質',
            data: [4, 3, 5, 4],
            backgroundColor: 'rgba(107,63,160,.7)',
            borderRadius: 4
          },
          {
            label: '操作難易',
            data: [5, 5, 2, 4],
            backgroundColor: 'rgba(13,148,136,.7)',
            borderRadius: 4
          },
          {
            label: '授權安全',
            data: [3, 4, 3, 5],
            backgroundColor: 'rgba(245,158,11,.7)',
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font:{size:10}, padding:8 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}：${'⭐'.repeat(ctx.raw)}` } }
        },
        scales: {
          y: {
            min: 0, max: 5,
            ticks: { color:'#6b7280', font:{size:10}, stepSize: 1, callback: v => v + '⭐' }
          },
          x: { ticks: { color:'#374151', font:{size:10} }, grid:{display:false} }
        }
      }
    });
  }
}

// ════════════════════════════════════════════════════════════
//  測驗功能
// ════════════════════════════════════════════════════════════
let curQuizId = null;
let quizUserAnswers = {};

function showQuiz(qId) {
  curQuizId = qId;
  quizUserAnswers = {};
  const q = quizzes[qId];
  document.getElementById('quiz-title').textContent = q.title;
  document.getElementById('quiz-score-preview').textContent = q.questions.length + ' 題';
  document.getElementById('quiz-result').textContent = '';
  document.getElementById('btn-submit-quiz').style.display = '';
  document.getElementById('btn-close-quiz').style.display = 'none';

  const body = document.getElementById('quiz-body');
  body.innerHTML = '';
  q.questions.forEach((question, qi) => {
    const div = document.createElement('div');
    div.className = 'quiz-q';
    div.innerHTML = `<div class="q-text">${qi+1}. ${question.q}</div>
      <div class="q-options" id="opts-${qi}">
        ${question.options.map((opt, oi) =>
          `<div class="q-opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})">${opt}</div>`
        ).join('')}
      </div>`;
    body.appendChild(div);
  });
  document.getElementById('quiz-overlay').classList.add('show');
}

function selectOpt(qi, oi) {
  quizUserAnswers[qi] = oi;
  const q = quizzes[curQuizId];
  for (let o = 0; o < q.questions[qi].options.length; o++) {
    document.getElementById(`opt-${qi}-${o}`).classList.toggle('selected', o === oi);
  }
}

function submitQuiz() {
  const q = quizzes[curQuizId];
  let correct = 0;
  q.questions.forEach((question, qi) => {
    const chosen = quizUserAnswers[qi];
    const opts = document.getElementById(`opts-${qi}`);
    for (let o = 0; o < question.options.length; o++) {
      const el = document.getElementById(`opt-${qi}-${o}`);
      el.onclick = null;
      el.classList.remove('selected');
      if (o === question.answer) el.classList.add('correct');
      else if (o === chosen && chosen !== question.answer) el.classList.add('wrong');
    }
    if (!opts.querySelector('.q-exp')) {
      const exp = document.createElement('div');
      exp.className = 'q-exp';
      exp.innerHTML = '💡 ' + question.explain;   // 解析內容中的 <strong> 等標記
      opts.after(exp);
    }
    if (chosen === question.answer) correct++;
  });
  const pct = Math.round((correct / q.questions.length) * 100);
  document.getElementById('quiz-result').textContent = `得分：${correct}/${q.questions.length}（${pct}%）`;
  document.getElementById('btn-submit-quiz').style.display = 'none';
  document.getElementById('btn-close-quiz').style.display = 'inline-block';
  answered[curQuizId] = true;
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('show');
  goTo(cur + 1);
}

// ════════════════════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
